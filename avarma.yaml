#   Repositories steht unter MIT (siehe LICENSE und NOTICE.md).
#
# EXPERIMENTELL – Registerzuordnung nicht vom Hersteller bestätigt.
#   Startadresse 0x1100 (= 4352) + Offset; im Betrieb geprüft an einer
#   Avarma 12 kW V1 (Software Hauptplatine 1514).
#
# Anschluss: RS485 A+/B− an die Displayleitung der Avarma (12 V NICHT anschließen,
#   Display wird abgeklemmt – der ESP32 ersetzt es als Modbus-Master). Siehe docs/hardware.md.
#
# Lesen: Messwerte, Zustands-/Fehlercodes, Zähler, Parameter.
# SCHREIBEN: nur die Entitäten unter "number:" und "select:" (Betrieb, Regelart, Vorlauf-Soll,
#   Hysterese P06, Frequenzen P46/P47/P114, Lüfter max P60, Nachtmodus P15–P17).
#   Jede Änderung wirkt sofort auf die Anlage. Kältekreis/EEV (P32, P89–P96) wird nie geschrieben.
#
# Gerätename "Hausinstallation Avarma" beibehalten – die HA-Packages erwarten
# Entitäts-IDs mit dem Präfix hausinstallation_avarma_.
# Benötigte secrets.yaml-Einträge: wifi_ssid, wifi_password, ap_password,
#   api_encryption_key, ota_password (Vorlage: secrets.example.yaml)
# =========================================================================

esphome:
  name: hausinstallation-avarma
  friendly_name: Hausinstallation Avarma

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  level: INFO
  # Zur Fehlersuche beim Modbus-Auslesen die folgenden Zeilen aktivieren:
  # logs:
  #   modbus_controller: DEBUG
  #   modbus: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Avarma Fallback Hotspot"
    password: !secret ap_password

captive_portal:
 
# -------------------------------------------------------------------------
# RS485 am Waveshare-Board (Anschluss an COMM 4 / Display-Port der Avarma)
# -------------------------------------------------------------------------
uart:
  - id: modbus_uart
    tx_pin: GPIO17
    rx_pin: GPIO18
    baud_rate: 9600
    data_bits: 8
    stop_bits: 1
    parity: NONE
 
modbus:
  id: avarma_modbus
  uart_id: modbus_uart
  flow_control_pin: GPIO21
 
# Avarma Wärmepumpe, Modbus-Slave-Adresse 1
modbus_controller:
  - id: avarma_wp
    modbus_id: avarma_modbus
    address: 1
    update_interval: 10s
 
# -------------------------------------------------------------------------
# Sensoren: Live-Werte (nur lesen, alle 10 s)
# -------------------------------------------------------------------------
sensor:
  - platform: modbus_controller
    modbus_controller_id: avarma_wp
    name: "Außentemperatur"          # C02, 0x1108
    address: 4360
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
 
  - platform: modbus_controller
    modbus_controller_id: avarma_wp
    name: "Rücklauftemperatur"          # C07 Wassereintritt, 0x110D
