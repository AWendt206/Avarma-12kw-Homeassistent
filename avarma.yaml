binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic
 
# -------------------------------------------------------------------------
# STEUERUNG – die einzigen beschreibbaren Register dieser Konfiguration
# Ausgangsstand vor jeder Änderung (2026-11-02): P00 = 0, P02 = 32, P06 = 50 (5,0 K),
# P19 = 0, P46 = 30, P47 = 30, P60 = 70 (700 U/min), P114 = 5
# -------------------------------------------------------------------------
number:
  - platform: modbus_controller
    modbus_controller_id: avarma_wp
    name: "Vorlauf-Sollwert Heizen"          # P02, 0x1002 (Forum: Heizen-Sollwert)
    address: 4098
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 25
    max_value: 45
    step: 1
    mode: box
    # Falls die Wärmepumpe Schreibbefehle nicht annimmt, testweise aktivieren:
    # use_write_multiple: true
 
  - platform: modbus_controller
    modbus_controller_id: avarma_wp
    name: "Hysterese Heizen"          # P06, 0x2004 (Rohwert 50 = 5,0 K)
    address: 8196
    value_type: U_WORD
    unit_of_measurement: "K"
    multiply: 10
    min_value: 3
    max_value: 8
    step: 0.5
    mode: box
 
  - platform: modbus_controller
    modbus_controller_id: avarma_wp
    name: "Mindestfrequenz Verdichter"          # P46, 0x202C
    address: 8236
    value_type: U_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    min_value: 30
    max_value: 35
    step: 1
    mode: box
 
  - platform: modbus_controller
    modbus_controller_id: avarma_wp
    name: "Maximaldrehzahl Lüfter"          # P60, 0x203A (Rohwert 70, Annahme: 70 = 700 U/min)
    address: 8250
    value_type: U_WORD
    unit_of_measurement: "U/min"
    multiply: 0.1
    min_value: 700
    max_value: 900
    step: 10
    mode: box
 
  - platform: modbus_controller
    modbus_controller_id: avarma_wp
    name: "Frequenzabsenkung"          # P114, 0x206E
    address: 8302
    value_type: U_WORD
    unit_of_measurement: "%"
    min_value: 2
    max_value: 5
    step: 1
    mode: box
 
  - platform: modbus_controller
    modbus_controller_id: avarma_wp
    name: "Abtaufrequenz"          # P47, 0x202D (Werk 65 Hz, Handbuch 30–90 Hz)
    address: 8237
    value_type: U_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    min_value: 30
    max_value: 70
    step: 5
    mode: box
 
  - platform: modbus_controller
    modbus_controller_id: avarma_wp
    name: "Nachtmodus Start"          # P15, 0x200D, Stunde 0-23 (Werk 22)
    address: 8205
    value_type: U_WORD
    unit_of_measurement: "h"
    min_value: 0
    max_value: 23
    step: 1
    mode: box
 
  - platform: modbus_controller
    modbus_controller_id: avarma_wp
    name: "Nachtmodus Ende"          # P16, 0x200E, Stunde 0-23 (Werk 6)
    address: 8206
    value_type: U_WORD
    unit_of_measurement: "h"
    min_value: 0
    max_value: 23
    step: 1
    mode: box
 
select:
  - platform: modbus_controller
    modbus_controller_id: avarma_wp
    name: "Regelart Heizen"          # P19, 0x2011 (Annahme: 0 = fester Sollwert, 1 = OTC)
    address: 8209
    value_type: U_WORD
    optionsmap:
      "Fester Sollwert": 0
      "Witterungsgeführt (OTC)": 1
 
  - platform: modbus_controller
    modbus_controller_id: avarma_wp
    name: "Betrieb"          # P00, 0x1000 (Annahme: 0 = AUS, 1 = EIN)
    address: 4096
    value_type: U_WORD
    optionsmap:
      "AUS": 0
      "EIN": 1
 
  - platform: modbus_controller
    modbus_controller_id: avarma_wp
    name: "Nachtmodus"          # P17, 0x200F, 0 = aus, 1 = ein (leiser, reduzierte Verdichter-/Lüfterleistung)
    address: 8207
    value_type: U_WORD
    optionsmap:
      "AUS": 0
      "EIN": 1
 