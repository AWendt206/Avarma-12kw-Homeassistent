      - number.hausinstallation_avarma_hysterese_heizen
      - number.hausinstallation_avarma_frequenzabsenkung
      - number.hausinstallation_avarma_mindestfrequenz_verdichter
      - number.hausinstallation_avarma_abtaufrequenz
      - number.hausinstallation_avarma_maximaldrehzahl_lufter
      - number.hausinstallation_avarma_nachtmodus_start
      - number.hausinstallation_avarma_nachtmodus_ende
      - select.hausinstallation_avarma_betrieb
