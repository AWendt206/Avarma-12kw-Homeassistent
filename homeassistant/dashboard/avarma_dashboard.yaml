        - background: "radial-gradient(120% 140% at 0% 0%, #1b3352 0%, #111d30 55%, #0c1626 100%)"
        - border: "1px solid #2a3b55"
        - border-radius: 18px
        - padding: 16px
        - box-shadow: none
        - overflow: hidden
        - container-type: inline-size
      grid:
        - grid-template-areas: "\"br\""
        - grid-template-columns: 1fr
      custom_fields:
        br:
          - width: 100%
    custom_fields:
      br: |-
        [[[
        const S = (id) => (states[id] ? states[id].state : 'unavailable');
        const on = S('binary_sensor.hausinstallation_avarma_status') === 'on';
        const mode = S('sensor.avarma_visueller_modus');
        const run = S('binary_sensor.avarma_verdichter_lauft') === 'on';
        const ML = {heizen: 'Heizbetrieb läuft', abtauen: 'Abtauung läuft', standby: 'Betriebsbereit · Verdichter in Pause', aus: 'Ausgeschaltet', stoerung: 'Störung', offline: 'Keine Verbindung'};
        const pc = on ? ['#48d18c', '#0f2a1e', '#2f6b4a', 'ONLINE'] : ['#ff727f', '#2a1216', '#6b2f38', 'OFFLINE'];
        let blades = '';
        for (let a = 0; a < 360; a += 72) blades += '<path d="M0 -3 C 9 -5, 22 -15, 20 -25 C 12 -26, 5 -15, 0 -3 Z" fill="#7d8ba0" transform="rotate(' + a + ')"/>';
        const unit = '<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">'
         + '<defs><linearGradient id="bu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25324a"/><stop offset="1" stop-color="#0c1320"/></linearGradient>'
         + '<linearGradient id="be" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ac8ef"/><stop offset="1" stop-color="#4c9eff"/></linearGradient>'
         + '<filter id="bg2"><feGaussianBlur stdDeviation="6"/></filter></defs>'
         + '<ellipse cx="100" cy="136" rx="82" ry="8" fill="#3ac8ef" opacity=".45" filter="url(#bg2)"/>'
         + '<path d="M22 22 L32 12 H188 V118 L178 128 Z" fill="#101827"/>'
         + '<rect x="12" y="22" width="166" height="106" rx="10" fill="url(#bu)" stroke="#3b4c66" stroke-width="2"/>'
         + '<rect x="12" y="124" width="166" height="4" rx="2" fill="url(#be)"/>'
         + '<circle cx="62" cy="75" r="40" fill="#070b12" stroke="#41516a" stroke-width="2.5"/>'
         + '<circle cx="62" cy="75" r="33" fill="none" stroke="#1f2a3a" stroke-width="1.5"/><circle cx="62" cy="75" r="25" fill="none" stroke="#1f2a3a" stroke-width="1.5"/>'
         + '<g transform="translate(62 75)"><g>' + (run ? '<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>' : '') + blades + '<circle r="6" fill="#b9c4d3"/></g></g>'
         + '<text x="138" y="52" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" fill="#dbe6f5" letter-spacing="1.5">AVARMA</text>'
         + '<g stroke="#2c3a50" stroke-width="2">' + [70, 80, 90, 100].map((y) => '<path d="M112 ' + y + ' H166"/>').join('') + '</g>'
         + '</svg>';
        return '<div class="br"><div class="un">' + unit + '</div><div class="tx">'
         + '<div class="k"><ha-icon icon="mdi:home-assistant"></ha-icon>Home Assistant · Dashboard</div>'
         + '<div class="n">Avarma <b>12 kW</b></div><div class="s">Wärmepumpe · R290 · RS485</div>'
         + '<div class="pl" style="color:' + pc[0] + ';background:' + pc[1] + ';border-color:' + pc[2] + '"><span class="dot" style="background:' + pc[0] + '"></span>' + pc[3] + '</div>'
         + '<div class="m">' + (ML[mode] || 'Status unbekannt') + '</div></div></div>';
        ]]]
    extra_styles: |-
      .br{display:flex;align-items:center;gap:12px;color:#f0f7ff;font-family:Inter,Roboto,"Segoe UI",sans-serif;text-align:left}
      .un{width:clamp(96px,36%,190px);flex:none}.un svg{width:100%;height:auto;display:block}
      .tx{min-width:0;flex:1}.tx div{white-space:normal}
      .k{display:flex;align-items:center;gap:6px;font-size:12px;color:#7fb8d8;letter-spacing:.04em}.k ha-icon{--mdc-icon-size:16px;color:#3ac8ef;flex:none}
      .tx .n{font-size:clamp(20px,8cqi,30px);font-weight:300;line-height:1.1;margin-top:4px;white-space:nowrap}.n b{font-weight:800;color:#3ac8ef}
      .s{color:#91a5c0;font-size:clamp(11.5px,3.6cqi,13px);letter-spacing:.04em;margin-top:2px}
      .pl{display:inline-flex;gap:8px;align-items:center;margin-top:10px;padding:3px 12px;border-radius:999px;border:1px solid;font-weight:800;font-size:12px;letter-spacing:.1em}
      .dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px currentColor}
      .m{font-size:13px;color:#c9d7ea;margin-top:8px}
      @container (max-width:360px){.k{display:none}.tx .n{margin-top:0}.pl{margin-top:8px}}
