# Copyright (c) 2026 AWendt206 · MIT-Lizenz · https://github.com/AWendt206/
# Projekt: avarma-ha · EXPERIMENTELL – keine Herstellerfreigabe, ersetzt keine Schutzfunktion
# Einfügen: Einstellungen → Dashboards → Dashboard hinzufügen → ⋮ → Rohdaten-Konfigurationseditor → Inhalt ersetzen.
# Benötigt: button-card, card-mod, apexcharts-card (HACS/Marketplace) und www/avarma/avarma-parameter-wirkung-card.js.
# Platzhalter: GRAFANA_INGRESS_ID (nur Energie-Grafana-Kacheln und Langzeit-Button), Raum-/RCBO-Sensoren siehe docs/installation.md
title: Wärmepumpe Neu
views:
  - badges: []
    icon: mdi:heat-pump
    max_columns: 3
    path: uebersicht
    sections:
      - type: grid
        column_span: 3
        cards:
          - content: |-
              ### ❄ Abtauung läuft
              Der Verdampfer wird abgetaut, die Heizleistung fehlt für einige Minuten.
            grid_options:
              columns: full
            type: markdown
            visibility:
              - condition: state
                entity: binary_sensor.avarma_abtauung
                state: "on"
            card_mod:
              style: "ha-card { background: #111d30 !important; border: 1px solid #2a3b55 !important; border-radius: 18px !important; color: #f0f7ff; box-shadow: none !important; backdrop-filter: none !important; }"
          - content: |-
              ### ⚠ Störung: {{ states('sensor.avarma_aktive_fehler') }}
              Details im Tab „Service“.
            grid_options:
              columns: full
            type: markdown
            visibility:
              - condition: state
                entity: binary_sensor.avarma_fehler_aktiv
                state: "on"
            card_mod:
              style: "ha-card { background: #111d30 !important; border: 1px solid #2a3b55 !important; border-radius: 18px !important; color: #f0f7ff; box-shadow: none !important; backdrop-filter: none !important; }"
          - content: |-
              ### 🔌 ESP32 nicht verbunden
              Die Werte sind nicht aktuell, Schalten ist nicht möglich.
            grid_options:
              columns: full
            type: markdown
            visibility:
              - condition: state
                entity: binary_sensor.hausinstallation_avarma_status
                state: "off"
            card_mod:
              style: "ha-card { background: #111d30 !important; border: 1px solid #2a3b55 !important; border-radius: 18px !important; color: #f0f7ff; box-shadow: none !important; backdrop-filter: none !important; }"
          - content: "**Avarma ist aus.** Die Frostsperre schaltet sie bei Außentemperaturen unter 4 °C ein."
            grid_options:
              columns: full
            type: markdown
            visibility:
              - condition: state
                entity: select.hausinstallation_avarma_betrieb
                state: AUS
            card_mod:
              style: "ha-card { background: #111d30 !important; border: 1px solid #2a3b55 !important; border-radius: 18px !important; color: #f0f7ff; box-shadow: none !important; backdrop-filter: none !important; }"
          - type: custom:button-card
            template: av_bar
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: custom:button-card
            template: av_schema
            grid_options:
              columns: full
          - type: custom:button-card
            template: av_ampel_bar
            grid_options:
              columns: full
          - type: custom:button-card
            template: av_diag_hint
            grid_options:
              columns: full
            visibility:
              - condition: state
                entity: sensor.avarma_kk_diagnosestatus
                state:
                  - "Prüfen: Messkette"
                  - Beobachtung
                  - Messqualität unklar
                  - Herstelleralarm
          - type: custom:button-card
            template: av_srow
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: custom:button-card
            template: av_brand
            grid_options:
              columns: full
            visibility:
              - condition: screen
                media_query: "(min-width: 768px)"
          - type: custom:button-card
            template: av_betrieb
            grid_options:
              columns: full
          - type: custom:button-card
            template: av_rooms
            grid_options:
              columns: full
          - type: tile
            entity: number.hausinstallation_avarma_vorlauf_sollwert_heizen
            name: Vorlauf-Sollwert (P02)
            icon: mdi:thermometer-check
            color: red
            features:
              - type: numeric-input
                style: buttons
            card_mod:
              style: "ha-card { background: #111d30 !important; border: 1px solid #2a3b55 !important; border-radius: 18px !important; color: #f0f7ff; box-shadow: none !important; backdrop-filter: none !important; }"
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            graph_span: 24h
            header:
              show: true
              title: Räume, Außen und Vorlauf (24 h)
              show_states: true
              colorize_states: true
            apex_config:
              chart:
                height: 260
                background: transparent
                foreColor: "#91a5c0"
                toolbar:
                  show: false
              grid:
                borderColor: "#22324a"
                strokeDashArray: 3
              legend:
                show: false
              theme:
                mode: dark
              tooltip:
                theme: dark
            series:
              - entity: sensor.hausinstallation_avarma_vorlauftemperatur
                name: Vorlauf
                color: "#ff4b3e"
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.avarma_raum1_temperatur
                name: Wohnzimmer
                color: "#48d18c"
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 10min
              - entity: sensor.avarma_raum2_temperatur
                name: Büro
                color: "#b5a0ff"
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 10min
              - entity: sensor.hausinstallation_avarma_aussentemperatur
                name: Außen
                color: "#3ac8ef"
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 10min
            card_mod:
              style: "ha-card { background: #111d30 !important; border: 1px solid #2a3b55 !important; border-radius: 18px !important; color: #f0f7ff; box-shadow: none !important; backdrop-filter: none !important; }"
            grid_options:
              columns: full
              rows: auto
      - type: grid
        cards:
          - type: logbook
            title: Verlauf & Status
            hours_to_show: 24
            target:
              entity_id:
                - sensor.avarma_visueller_modus
                - binary_sensor.avarma_abtauung
                - select.hausinstallation_avarma_betrieb
            card_mod:
              style: "ha-card { background: #111d30 !important; border: 1px solid #2a3b55 !important; border-radius: 18px !important; color: #f0f7ff; box-shadow: none !important; backdrop-filter: none !important; }"
            grid_options:
              columns: full
              rows: 7
    title: Übersicht
    type: sections
  - badges:
      - color: green
        entity: select.hausinstallation_avarma_betrieb
        icon: mdi:power
        name: Betrieb
        show_icon: true
        show_name: true
        show_state: true
        type: entity
      - color: teal
        entity: sensor.hausinstallation_avarma_aussentemperatur
        icon: mdi:thermometer
        name: Außen
        show_icon: true
        show_name: true
        show_state: true
        type: entity
      - color: orange
        entity: sensor.hausinstallation_avarma_verdichterfrequenz_ist
        icon: mdi:engine
        name: Verdichter
        show_icon: true
        show_name: true
        show_state: true
        type: entity
      - color: amber
        entity: sensor.avarma_strom_leistung
        icon: mdi:flash
        name: Strom
        show_icon: true
        show_name: true
        show_state: true
        type: entity
      - color: blue
        entity: binary_sensor.avarma_abtauung
        icon: mdi:snowflake-melt
        name: Abtauung
        show_icon: true
        show_name: true
        show_state: true
        type: entity
        visibility:
          - condition: state
            entity: binary_sensor.avarma_abtauung
            state: "on"
      - color: red
        entity: binary_sensor.avarma_fehler_aktiv
        icon: mdi:alert-octagon
        name: Fehler
        show_icon: true
        show_name: true
        show_state: true
        type: entity
        visibility:
          - condition: state
            entity: binary_sensor.avarma_fehler_aktiv
            state: "on"
      - color: red
        entity: binary_sensor.hausinstallation_avarma_status
        icon: mdi:lan-disconnect
        name: ESP32
        show_icon: true
        show_name: true
        show_state: true
        type: entity
        visibility:
          - condition: state
            entity: binary_sensor.hausinstallation_avarma_status
            state: "off"
    icon: mdi:lightning-bolt
    max_columns: 3
    path: energie
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:button-card
            template: av_energie
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: statistics-graph
            title: Strom und Wärme pro Tag (14 Tage)
            entities:
              - entity: sensor.avarma_strom_energie
                name: Strom
                color: "#ffd54f"
              - entity: sensor.avarma_warmemenge_schatzung
                name: Wärme (Schätzung)
                color: "#ff8a2a"
            stat_types:
              - change
            period: day
            chart_type: bar
            days_to_show: 14
            card_mod:
              style: "ha-card { background: #111d30 !important; border: 1px solid #2a3b55 !important; border-radius: 18px !important; color: #f0f7ff; box-shadow: none !important; backdrop-filter: none !important; }"
            grid_options:
              columns: full
              rows: 6
          - type: custom:apexcharts-card
            graph_span: 24h
            header:
              show: true
              title: Verdichter und Strom (24 h)
              show_states: true
              colorize_states: true
            apex_config:
              chart:
                height: 240
                background: transparent
                foreColor: "#91a5c0"
                toolbar:
                  show: false
              grid:
                borderColor: "#22324a"
                strokeDashArray: 3
              legend:
                show: false
              theme:
                mode: dark
              tooltip:
                theme: dark
            yaxis:
              - id: hz
                min: 0
                decimals: 0
              - id: w
                opposite: true
                min: 0
                decimals: 0
            series:
              - entity: sensor.hausinstallation_avarma_verdichterfrequenz_ist
                name: Frequenz
                color: "#ff8a2a"
                yaxis_id: hz
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.avarma_strom_leistung
                name: Strom
                color: "#ffd54f"
                yaxis_id: w
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 5min
            card_mod:
              style: "ha-card { background: #111d30 !important; border: 1px solid #2a3b55 !important; border-radius: 18px !important; color: #f0f7ff; box-shadow: none !important; backdrop-filter: none !important; }"
            grid_options:
              columns: full
              rows: auto
      - type: grid
        cards:
          - type: custom:button-card
            template: av_tiles
            triggers_update:
              - sensor.avarma_verdichterstarts_heute
              - sensor.hausinstallation_avarma_abtauungen_tag_anlage
              - sensor.avarma_laufzeit_heute
              - sensor.avarma_o_laufzeit_pro_start
            variables:
              title: Takte heute
              icon: mdi:counter
              items:
                - i: mdi:play-circle
                  c: "#b5a0ff"
                  l: Starts inkl. Abtauung
                  e: sensor.avarma_verdichterstarts_heute
                - i: mdi:snowflake
                  c: "#4c9eff"
                  l: Abtauungen
                  e: sensor.hausinstallation_avarma_abtauungen_tag_anlage
                - i: mdi:timer
                  c: "#ffbf55"
                  l: Laufzeit
                  e: sensor.avarma_laufzeit_heute
                  fmt: hm
                - i: mdi:timer-outline
                  c: "#ff8a2a"
                  l: Ø je Start
                  e: sensor.avarma_o_laufzeit_pro_start
                  u: min
              minw: 130
            grid_options:
              columns: full
          - type: custom:button-card
            template: av_tiles
            triggers_update:
              - sensor.hausinstallation_avarma_verdichterstarts_gesamt
              - sensor.hausinstallation_avarma_abtauvorgange_gesamt
              - sensor.hausinstallation_avarma_verdichter_betriebsstunden
            variables:
              title: Seit Inbetriebnahme
              icon: mdi:history
              items:
                - i: mdi:counter
                  c: "#b5a0ff"
                  l: Starts
                  e: sensor.hausinstallation_avarma_verdichterstarts_gesamt
                - i: mdi:snowflake-melt
                  c: "#4c9eff"
                  l: Abtauungen
                  e: sensor.hausinstallation_avarma_abtauvorgange_gesamt
                - i: mdi:clock-outline
                  c: "#91a5c0"
                  l: Betriebsstunden
                  e: sensor.hausinstallation_avarma_verdichter_betriebsstunden
                  u: h
              minw: 130
            grid_options:
              columns: full
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Grafana · 14 Tage
            heading_style: subtitle
            icon: mdi:chart-timeline-variant
          - type: iframe
            url: /api/hassio_ingress/GRAFANA_INGRESS_ID/d-solo/avarma-waermepumpe/f09f8ca1-efb88f-warmepumpe-avarma?orgId=1&from=now-14d&to=now&timezone=browser&refresh=1m&theme=dark&panelId=panel-14
            aspect_ratio: 75%
            card_mod:
              style: "ha-card { background: #111d30 !important; border: 1px solid #2a3b55 !important; border-radius: 18px !important; color: #f0f7ff; box-shadow: none !important; backdrop-filter: none !important; }"
            grid_options:
              columns: 18
          - type: iframe
            url: /api/hassio_ingress/GRAFANA_INGRESS_ID/d-solo/avarma-waermepumpe/f09f8ca1-efb88f-warmepumpe-avarma?orgId=1&from=now-14d&to=now&timezone=browser&refresh=1m&theme=dark&panelId=panel-13
            aspect_ratio: 75%
            card_mod:
              style: "ha-card { background: #111d30 !important; border: 1px solid #2a3b55 !important; border-radius: 18px !important; color: #f0f7ff; box-shadow: none !important; backdrop-filter: none !important; }"
            grid_options:
              columns: 18
          - type: markdown
            content: |-
              <details><summary>So wird gezählt und gerechnet</summary>

              **Starts und Abtauungen** heute: Starts aus der Verdichterfrequenz, Abtauungen aus dem Zähler der Anlage. **Wärme** ist eine Schätzung aus Durchfluss × Spreizung, **Strom** kommt vom RCBO inklusive Standby. Die **Arbeitszahl** ist Wärme geteilt durch Strom im selben Zeitraum, Zählbeginn 03.11.2026.
              </details>
            card_mod:
              style: "ha-card { background: #111d30 !important; border: 1px solid #2a3b55 !important; border-radius: 18px !important; color: #f0f7ff; box-shadow: none !important; backdrop-filter: none !important; }"
            grid_options:
              columns: full
