        g += tx(500, 76, 'Verflüssiger', 't', 'middle') + tx(500, 102, 'Tk ' + N(P + 'kondensationstemperatur', 1, '°C'), 'v', 'middle') + tx(500, 126, 'Pd ' + N(P + 'hochdruck', 1, 'bar'), 'v', 'middle');
        g += '<g class="wa"><path d="M400 165 H300" stroke="#ff727f"/><path d="M300 185 H400" stroke="#4c9eff"/></g>';
        g += tx(292, 170, 'VL ' + N(P + 'vorlauftemperatur', 1, '°C'), 'v sm', 'end') + tx(292, 190, 'RL ' + N(P + 'rucklauftemperatur', 1, '°C'), 'v sm', 'end');
        g += tx(350, 212, 'Heizwasser ' + N(P + 'wasserdurchfluss', 1, 'l/min'), 'v xs', 'middle');
        // Flüssigleitung + Expansionsventil
        g += tx(572, 186, 'Ty ' + N(P + 'flussigtemperatur_kaltemittel', 1, '°C'), 'v sm');
        g += '<path d="M546 222 L574 222 L546 258 L574 258 Z" class="box" stroke="#b5a0ff"/>';
        g += tx(584, 238, 'EEV', 't sm') + tx(584, 258, N(P + 'expansionsventil_schritte', 0, ''), 'v sm') + tx(584, 276, 'Schritte', 'v xs');
        // Verdampfer mit Lüfter
        g += '<rect x="40" y="270" width="220" height="100" rx="12" class="box" stroke="' + LOW + '"/>';
        g += '<g transform="translate(92 320)"><circle r="30" fill="#070b12" stroke="#41516a" stroke-width="2"/><g>' + (fan ? '<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>' : '') + blades + '<circle r="4.5" fill="#c9d3e0"/></g></g>';
        g += tx(190, 296, 'Verdampfer', 't', 'middle') + tx(190, 322, 'Te ' + N(P + 'verdampfungstemperatur', 1, '°C'), 'v', 'middle') + tx(190, 346, 'Ps ' + N(P + 'niederdruck', 1, 'bar'), 'v', 'middle');
        g += tx(150, 388, 'Luft ' + N(P + 'aussentemperatur', 1, '°C') + ' · Lamelle ' + N(P + 'lamellentemperatur', 1, '°C') + ' · Lüfter ' + N(P + 'lufter_1_drehzahl', 0, 'U/min'), 'v xs', 'middle');
        g += tx(122, 222, 'Sauggas Ts ' + N(P + 'sauggastemperatur', 1, '°C'), 'v sm');
        g += tx(410, 318, 'nach Expansion', 'v xs', 'middle');
        if (def) g += '<g><rect x="250" y="236" width="240" height="38" rx="10" fill="#2a2412" stroke="#ffbf55"/>' + tx(370, 260, 'Abtauung · Kreislauf umgekehrt', 'v sm ab', 'middle') + '</g>';
        else if (!run) g += '<g><rect x="270" y="236" width="200" height="38" rx="10" fill="#1a2433" stroke="#5c6b80"/>' + tx(370, 260, 'Verdichter steht', 'v sm', 'middle') + '</g>';
        g += '</svg>';
        const lg = [[HOT, 'Heißgas (Hochdruck)'], [LIQ, 'Flüssig (Hochdruck)'], [LOW, 'Nassdampf (Niederdruck)'], [SUC, 'Sauggas (Niederdruck)']]
          .map((x) => '<span><i style="background:' + x[0] + '"></i>' + x[1] + '</span>').join('');
        return '<div class="kk"><div class="hd"><ha-icon icon="mdi:snowflake-thermometer"></ha-icon><span class="h">Kältekreis</span><span class="md' + (run ? ' on' : '') + '">' + (def ? 'Abtauung' : run ? 'Verdichter läuft' : 'Stillstand') + '</span></div>'
          + '<div class="sv">' + g + '</div><div class="lg">' + lg + '</div></div>';
        ]]]
    extra_styles: |-
      .kk{font-family:Inter,Roboto,"Segoe UI",sans-serif;color:#f0f7ff;text-align:left}
