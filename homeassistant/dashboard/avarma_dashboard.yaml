              style: "ha-card { background: #111d30 !important; border: 1px solid #2a3b55 !important; border-radius: 18px !important; color: #f0f7ff; box-shadow: none !important; backdrop-filter: none !important; }"
            features_position: inline
          - type: tile
            entity: number.hausinstallation_avarma_vorlauf_sollwert_heizen
            name: Vorlauf-Sollwert (P02)
            icon: mdi:thermometer-check
            color: red
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 12
            card_mod:
              style: "ha-card { background: #111d30 !important; border: 1px solid #2a3b55 !important; border-radius: 18px !important; color: #f0f7ff; box-shadow: none !important; backdrop-filter: none !important; }"
            features_position: inline
          - type: markdown
            content: |-
              <details><summary>Erklärung</summary>

              **Betrieb (P00):** schaltet die Wärmepumpe ein oder aus.

              **Regelart (P19):** fester Sollwert oder witterungsgeführt (OTC). Die Heizkurve bei OTC ist nicht bekannt. Nach dem Umschalten den Vorlauf beobachten.

              **Vorlauf-Sollwert (P02):** gewünschte Vorlauftemperatur im festen Betrieb, zulässig 25–45 °C.

              *Ausgangsstand 2026-11-02:* Sollwert 32 °C, Regelart fest.
              </details>
            card_mod:
              style: "ha-card { background: #111d30 !important; border: 1px solid #2a3b55 !important; border-radius: 18px !important; color: #f0f7ff; box-shadow: none !important; backdrop-filter: none !important; }"
