            features_position: inline
          - type: tile
            entity: number.hausinstallation_avarma_mindestfrequenz_verdichter
            name: Mindestfrequenz Verdichter (P46)
            icon: mdi:speedometer-slow
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 12
            card_mod:
              style: "ha-card { background: #111d30 !important; border: 1px solid #2a3b55 !important; border-radius: 18px !important; color: #f0f7ff; box-shadow: none !important; backdrop-filter: none !important; }"
            features_position: inline
          - type: tile
            entity: number.hausinstallation_avarma_maximaldrehzahl_lufter
            name: Lüfter Maximaldrehzahl (P60)
            icon: mdi:fan
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 12
            card_mod:
              style: "ha-card { background: #111d30 !important; border: 1px solid #2a3b55 !important; border-radius: 18px !important; color: #f0f7ff; box-shadow: none !important; backdrop-filter: none !important; }"
            features_position: inline
          - type: tile
            entity: number.hausinstallation_avarma_abtaufrequenz
            name: Abtaufrequenz (P47)
            icon: mdi:snowflake-melt
            color: blue
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 12
            card_mod:
              style: "ha-card { background: #111d30 !important; border: 1px solid #2a3b55 !important; border-radius: 18px !important; color: #f0f7ff; box-shadow: none !important; backdrop-filter: none !important; }"
            features_position: inline
          - type: markdown
            content: |-
              <details><summary>Erklärung</summary>

              **Hysterese (P06), 3–8 K, Werk 5:** Temperaturabstand zwischen Ein und Aus. Größer bedeutet längere Läufe und Pausen, aber mehr Schwankung beim Vorlauf.

              **Frequenzabsenkung (P114), 2–5 %, Werk 2:** Absenkung der Verdichterfrequenz, wenn der Sollwert erreicht ist.

              **Mindestfrequenz (P46), 30–35 Hz, Werk 35:** Achtung, höher bedeutet mehr Takten bei geringem Bedarf. Werte unter 30 Hz sind hier gesperrt, weil die Herstellerfreigabe fehlt.

              **Lüfter (P60), 700–900 U/min, Werk 900:** Rohwert 70 entspricht 700 U/min. Bei der V1 warnt ein Forumsnutzer vor zu niedrigen Werten.

              **Abtaufrequenz (P47), 30–70 Hz, Werk 65:** Verdichterfrequenz beim Abtauen.

              *Ausgangsstand 2026-11-02:* P06 5,0 K, P114 5 %, P46 30 Hz, P47 30 Hz, P60 700 U/min.
              </details>
            card_mod:
              style: "ha-card { background: #111d30 !important; border: 1px solid #2a3b55 !important; border-radius: 18px !important; color: #f0f7ff; box-shadow: none !important; backdrop-filter: none !important; }"
