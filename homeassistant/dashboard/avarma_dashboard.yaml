    styles:
      card:
        - background: "#111d30"
        - border: "1px solid #2a3b55"
        - border-radius: 18px
        - padding: 16px
        - box-shadow: none
      grid:
        - grid-template-areas: "\"h\""
        - grid-template-columns: 1fr
      custom_fields:
        h:
          - width: 100%
    custom_fields:
      h: |-
        [[[
        const st = (id) => states[id];
        const S = (id) => (st(id) ? st(id).state : 'unavailable');
        const V = (id) => parseFloat(S(id));
        const F = (v, d, u) => (isNaN(v) ? '–' : v.toFixed(d).replace('.', ',') + (u ? ' ' + u : ''));
        const A = 'sensor.hausinstallation_avarma_';
        const C = { ok: '#3ee06a', warn: '#ffd23a', crit: '#ff3b4e', off: '#8a98ad' };
        const ago = (id) => { const s = st(id); if (!s) return ''; const m = Math.round((Date.now() - new Date(s.last_changed).getTime()) / 60000); return m < 60 ? 'vor ' + m + ' min' : m < 1440 ? 'vor ' + Math.round(m / 60) + ' h' : 'vor ' + Math.round(m / 1440) + ' d'; };
        const tile = (c, icon, t, v, sub) => '<div class="t" style="--c:' + c + '"><span class="led"></span><ha-icon icon="' + icon + '"></ha-icon><div class="tx"><div class="tl">' + t + '</div><div class="tv">' + v + '</div>' + (sub ? '<div class="ts">' + sub + '</div>' : '') + '</div></div>';
        const online = S('binary_sensor.hausinstallation_avarma_status') === 'on';
        const fe = S('sensor.avarma_aktive_fehler'), al = S('binary_sensor.avarma_alarm') === 'on';
        const r290 = V(A + 'r290_konzentration'), r290c = V(A + 'r290_alarm_code');
        const fs = S('binary_sensor.avarma_frostschutz_aktiv') === 'on';
        const wl = V(A + 'wlan_signal');
        const wq = isNaN(wl) ? ['–', C.off] : wl >= -60 ? ['gut', C.ok] : wl >= -75 ? ['mittel', C.warn] : ['schwach', C.crit];
        const auto = S('automation.avarma_frostsperre'), wish = S('binary_sensor.avarma_frostsperre_gewunscht') === 'on';
        const rc = S('switch.avarma_rcbo'), ev = S('sensor.avarma_rcbo_event');
        let h = '<div class="sv">';
        h += '<div class="hd"><ha-icon icon="mdi:stethoscope"></ha-icon><span class="h">Systemzustand</span><span class="hn">' + (online ? 'Daten aktuell' : 'Keine Verbindung – Werte veraltet') + '</span></div>';
        h += '<div class="tg">'
          + tile(!online ? C.off : fe === 'keine' ? C.ok : C.crit, 'mdi:alert-octagon', 'Störung', !online ? 'unbekannt' : fe === 'keine' ? 'keine' : fe, 'Fehlerspeicher: ' + S('sensor.avarma_fehlerspeicher'))
          + tile(!online ? C.off : al ? C.crit : C.ok, 'mdi:alarm-light', 'Alarm', al ? 'aktiv' : 'kein Alarm', '')
          + tile(!online ? C.off : r290 > 0 || r290c > 0 ? C.crit : C.ok, 'mdi:molecule', 'Kältemittel R290', F(r290, 1, '%') + ' Konzentration', 'Alarmcode ' + F(r290c, 0, ''))
          + tile(fs ? C.warn : C.ok, 'mdi:snowflake-alert', 'Frostschutz Anlage', fs ? 'aktiv' : 'inaktiv', '')
          + tile(online ? wq[1] : C.crit, 'mdi:lan-connect', 'ESP32 / RS485', online ? 'online' : 'offline', 'WLAN ' + F(wl, 0, 'dBm') + ' · ' + wq[0])
          + tile(auto === 'on' ? C.ok : C.warn, 'mdi:robot', 'Frostsperre-Automation', auto === 'on' ? 'aktiv' : 'ausgeschaltet', 'Wunsch: ' + (wish ? 'Betrieb' : 'Aus') + (auto === 'on' ? '' : ' – wird nicht umgesetzt'))
          + tile(rc === 'on' ? C.ok : C.crit, 'mdi:electric-switch', 'RCBO', rc === 'on' ? 'eingeschaltet' : rc === 'off' ? 'AUS / ausgelöst' : '–', 'Letztes Ereignis: ' + ev + ' ' + ago('sensor.avarma_rcbo_event'))
          + '</div>';
        const codes = [['Fehlergruppe 0', A + 'fehlergruppe_0_code'], ['Fehlergruppe 1', A + 'fehlergruppe_1_code'], ['Fehlergruppe 2', A + 'fehlergruppe_2_code'], ['Fehlergruppe 3', A + 'fehlergruppe_3_code'], ['Treiber 0', A + 'treiberfehler_0_code'], ['Treiber 1', A + 'treiberfehler_1_code'], ['Treiber 2', A + 'treiberfehler_2_code'], ['Frequenzbegrenzung', A + 'frequenzbegrenzung_code'], ['Ölrückführung', A + 'olruckfuhrung_aktiv']];
        h += '<div class="sh">Fehler- und Statuscodes der Anlage <small>0 = unauffällig</small></div><div class="cg">' + codes.map((c) => { const v = V(c[1]); const bad = !isNaN(v) && v !== 0;
          return '<span class="cc' + (bad ? ' bad' : isNaN(v) ? ' na' : '') + '">' + c[0] + '<b>' + F(v, 0, '') + '</b></span>'; }).join('') + '</div>';
        const bar = (t, icon, v, lim, u, d, lo) => {
          const lv = V(lim), x = V(v), loV = lo ? V(lo) : NaN;
          let p = NaN, pct = NaN, txt;
          if (lo) { // zweiseitig: Unter- und Überspannung
            p = (x - loV) / (lv - loV) * 100; const m = Math.min(x - loV, lv - x); pct = 100 - (m / ((lv - loV) / 2)) * 100;
            txt = F(x, d, u) + ' <small>Bereich ' + F(loV, 0, '') + '–' + F(lv, 0, u) + '</small>';
          } else { p = (x / lv) * 100; pct = p; txt = F(x, d, u) + ' <small>von ' + F(lv, 0, u) + '</small>'; }
          const c = isNaN(pct) ? C.off : pct >= 90 ? C.crit : pct >= 70 ? C.warn : C.ok;
          return '<div class="b"><div class="bh"><ha-icon icon="' + icon + '"></ha-icon><span>' + t + '</span><b>' + txt + '</b></div><div class="bt' + (lo ? ' two' : '') + '"><span class="bf" style="width:' + (isNaN(p) ? 0 : Math.max(2, Math.min(100, p))) + '%;background:' + c + '"></span></div></div>';
        };
        h += '<div class="sh">RCBO-Schutzreserve <small>Messwert im Verhältnis zur Auslöseschwelle</small></div><div class="bg">'
          + bar('Strom', 'mdi:current-ac', 'sensor.avarma_rcbo_current', 'number.avarma_rcbo_over_current_threshold', 'A', 1)
          + bar('Leistung', 'mdi:flash', 'sensor.avarma_strom_leistung', 'number.avarma_rcbo_over_power_threshold', 'W', 0)
          + bar('Fehlerstrom', 'mdi:current-dc', 'sensor.avarma_rcbo_leakage_current', 'number.avarma_rcbo_leakage_threshold', 'mA', 0)
          + bar('Temperatur', 'mdi:thermometer', 'sensor.avarma_rcbo_temperature', 'number.avarma_rcbo_temperature_threshold', '°C', 1)
          + bar('Spannung', 'mdi:sine-wave', 'sensor.avarma_rcbo_voltage', 'number.avarma_rcbo_over_voltage_threshold', 'V', 1, 'number.avarma_rcbo_under_voltage_threshold')
          + '</div>';
        const info = [['Betriebsstunden', F(V(A + 'verdichter_betriebsstunden'), 0, 'h')], ['Verdichterstarts', F(V(A + 'verdichterstarts_gesamt'), 0, '')], ['Abtauvorgänge', F(V(A + 'abtauvorgange_gesamt'), 0, '')], ['Netzspannung', F(V(A + 'netzspannung'), 0, 'V')], ['DC-Zwischenkreis', F(V(A + 'dc_zwischenkreis'), 0, 'V')], ['IPM-Temperatur', F(V(A + 'ipm_temperatur'), 0, '°C')], ['Software Hauptplatine', F(V(A + 'software_hauptplatine'), 0, '')], ['Software Platine', F(V(A + 'software_platine'), 0, '')], ['Modell Hauptplatine', F(V(A + 'modell_hauptplatine'), 0, '')]];
        h += '<div class="sh">Anlagendaten</div><div class="ig">' + info.map((i) => '<div class="ii"><span>' + i[0] + '</span><b>' + i[1] + '</b></div>').join('') + '</div>';
        return h + '</div>';
        ]]]
    extra_styles: |-
      .sv{font-family:Inter,Roboto,"Segoe UI",sans-serif;color:#f0f7ff;text-align:left}
      .hd{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:0 2px 12px}.hd ha-icon{--mdc-icon-size:28px;color:#3ac8ef}.h{font-size:22px;font-weight:800}.hn{margin-left:auto;font-size:12.5px;color:#91a5c0}
      .tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px}
      .t{position:relative;display:flex;align-items:flex-start;gap:10px;background:#16263d;border:1px solid #284263;border-radius:14px;padding:11px 12px}
      .t>ha-icon{--mdc-icon-size:24px;color:var(--c);flex:none;margin-top:2px}
      .led{position:absolute;top:12px;right:12px;width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 7px var(--c)}
      .tx{min-width:0;padding-right:14px}.tl{font-size:12.5px;color:#91a5c0}.tv{font-size:16px;font-weight:800;margin-top:1px}.ts{font-size:12px;color:#9fb3cc;margin-top:3px;line-height:1.35}
      .sh{margin:16px 2px 8px;font-size:14px;font-weight:800;color:#c9d7ea}.sh small{margin-left:8px;font-weight:500;color:#7f93ae}
      .cg{display:flex;flex-wrap:wrap;gap:6px}
      .cc{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border-radius:999px;border:1px solid #2f4a3c;background:rgba(62,224,106,.06);font-size:12.5px;color:#c9d7ea}
      .cc b{color:#3ee06a}.cc.bad{border-color:#7a2a33;background:rgba(255,59,78,.1)}.cc.bad b{color:#ff3b4e}.cc.na{border-color:#2f3f57;background:none}.cc.na b{color:#8a98ad}
      .bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 18px}
      .bh{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#c9d7ea}.bh ha-icon{--mdc-icon-size:18px;color:#91a5c0}.bh b{margin-left:auto;font-size:15px;color:#f0f7ff;white-space:nowrap}.bh small{font-size:11.5px;color:#7f93ae;font-weight:500}
      .bt{height:8px;border-radius:4px;background:#22324a;margin-top:6px;overflow:hidden}.bf{display:block;height:100%;border-radius:4px}
      .ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
      .ii{display:flex;flex-direction:column;background:#0f1a2b;border:1px solid #223450;border-radius:12px;padding:8px 12px}.ii span{font-size:12px;color:#91a5c0}.ii b{font-size:16px}
  av_tabelle:
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    triggers_update:
      - number.hausinstallation_avarma_mindestfrequenz_verdichter
      - number.hausinstallation_avarma_frequenzabsenkung
      - number.hausinstallation_avarma_hysterese_heizen
      - number.hausinstallation_avarma_maximaldrehzahl_lufter
      - number.hausinstallation_avarma_nachtmodus_start
      - select.hausinstallation_avarma_regelart_heizen
    styles:
      card:
        - background: "#111d30"
        - border: "1px solid #2a3b55"
        - border-radius: 18px
        - padding: 14px
        - box-shadow: none
      grid:
        - grid-template-areas: "\"t\""
        - grid-template-columns: 1fr
      custom_fields:
        t:
          - width: 100%
    custom_fields:
      t: |-
        [[[
        const S = (id) => (states[id] ? states[id].state : 'unavailable');
        const V = (id, d) => { const v = parseFloat(S(id)); return isNaN(v) ? '–' : v.toFixed(d || 0).replace('.', ','); };
        const N = 'number.hausinstallation_avarma_', R = 'sensor.hausinstallation_avarma_';
        const ROWS = [
          ['Verdichter', 'P46', 'Minimale Lauffrequenz', '~35 Hz', '25 Hz', '32 Hz', 'Tieferes Heruntermodulieren, geringere Mindestleistung; risikoarm sichert Ölrückfluss und Expansionsventil.', 'ok', 'Handbuch: P46 Minimale Lauffrequenz, 0–90 Hz, Werk 35 Hz. Im Dashboard einstellbar 30–35 Hz, aktuell <b>' + V(N + 'mindestfrequenz_verdichter') + ' Hz</b>. 25 Hz hier gesperrt (Ölrückfluss/EEV), 32 Hz möglich.'],
          ['Verdichter', 'P114', 'Verringerungsprozentsatz Frequenz', '~2 %', '5 %', '5 %', 'Schnelleres Herunterregeln vor dem Sollwert, verhindert Überschießen.', 'ok', 'Handbuch: P114 Verringerungsprozentsatz nach Erreichen der Solltemperatur, 0–60 %, Werk 2 %. Einstellbar 2–5 %, aktuell <b>' + V(N + 'frequenzabsenkung') + ' %</b>.'],
          ['Verdichter', 'P45', 'Startfrequenz des Verdichters', '~50 Hz', '40 Hz', '40 Hz', 'Sanfterer Anlauf, der 60-l-Puffer wird nicht sofort überladen.', 'warn', '<b>Handbuch: P45 = Maximale Lauffrequenz</b> (50–120 Hz, Werk 85 Hz bei 12 kW; aktuell ' + V(R + 'p45') + ' Hz) – 40 Hz würde die Heizleistung begrenzen. Startfrequenz ist <b>P105</b> „Verdichterstartfrequenz A“ (20–60 Hz, Werk 35; aktuell ' + V(R + 'p105') + ' Hz). Beide nur lesbar.'],
          ['Temperaturen', 'P24', 'Hysterese Heizen', '2,0 K', '4–5 K', '5–6 K', 'Haupthebel: größeres Temperaturfenster, längere Zyklen.', 'warn', '<b>Hysterese ist P06</b> „A/C Temperaturdifferenz“ (Handbuch 1–15 °C, Werk 5; hier einstellbar 3–8 K, aktuell <b>' + V(N + 'hysterese_heizen', 1) + ' K</b>). P24 ist laut Handbuch der Parallelverschiebungswert der E-Zusatzheizung (1–15 °C, Werk 5) – nicht verändern.'],
          ['Zeiten', 'P32', 'Mindest-Ausschaltzeit', '3 min', '6–10 min', '10–15 min', 'Feste Mindestpause für den Verdichter (Kompressorschutz).', 'crit', '<b>P32 ist laut Handbuch der EEV-Steuerungsmodus</b> (0 kein, 1 Tabelle, 2 manuell, 3 Sauggasüberhitzung, 4 Druckgasüberhitzung; Werk 3, aktuell ' + V(R + 'p32') + '). <b>Niemals ändern</b> – regelt das Expansionsventil. Eine Mindest-Ausschaltzeit gibt es in der Parametertabelle nicht.'],
          ['Hydraulik', 'P14', 'Steuerungsmodus Umwälzpumpe', '0 (Auto)', '1 (Konstant)', '1 (Konstant)', 'Dauerbetrieb sichert den Mindestvolumenstrom.', 'warn', '<b>Pumpen-Betriebsart ist P20</b> (0 ohne Stopp = Dauerbetrieb, 1 Stopp bei Solltemperatur, 2 alle 15 min 1 min; Werk 0, aktuell ' + V(R + 'p20') + '). P14 ist laut Handbuch die Moduswahl der thermischen Desinfektion (Werk 2 = OFF). Beide nur lesbar.'],
          ['Hydraulik', 'P15', 'Maximale Pumpenleistung', '80 %', '90–100 %', '90–100 %', 'Höherer Wasserdurchsatz, Wärme wird schneller abgeführt.', 'warn', '<b>P15 ist der Start des Nachtmodus</b> (aktuell ' + V(N + 'nachtmodus_start') + ' Uhr). Pumpe laut Handbuch: P59 Minimale Laufgeschwindigkeit der PWM-Pumpe (2–8 = 20–80 %, Werk 8 = 80 %), P58 Temperaturdifferenz der regelbaren Pumpe (3–8 °C, Werk 5). Eine maximale Pumpenleistung gibt es nicht; nur lesbar.'],
          ['Lüfter', 'P60', 'Maximale Lüftergeschwindigkeit', '~900 U/min', '600–650 U/min', '600–650 U/min', 'Leiser, weniger Leistungsaufnahme an milden Tagen.', 'ok', 'Handbuch: P60 Maximale Laufgeschwindigkeit des DC-Motors, 500–1500 U/min, Werk 900 (12 kW). Im Dashboard einstellbar 700–900 U/min, aktuell <b>' + V(N + 'maximaldrehzahl_lufter') + ' U/min</b>; 600–650 hier gesperrt (zu geringer Luftstrom, Vereisung/Abtauhäufigkeit).'],
          ['Lüfter', 'P19', 'Reduzierungswert Lüfter (Heizen)', 'vordefiniert', 'schrittweise erhöhen', 'schrittweise erhöhen', 'Sanfterer, langsamerer Lüfteranlauf.', 'warn', '<b>P19 ist laut Handbuch „A/C AU AUS/EIN“</b> (hier als Regelart: ' + S('select.hausinstallation_avarma_regelart_heizen') + '). Lüfterregelung beim Heizen: <b>P37</b> Temperaturunterschied für regelbare DC-Lüftergeschwindigkeit (2–15 °C, Werk 6) – nur lesbar.'],
        ];
        const ST = { ok: ['#48d18c', 'mdi:check-circle', 'gleiche Bedeutung'], warn: ['#ffbf55', 'mdi:alert', 'andere Bedeutung'], q: ['#91a5c0', 'mdi:help-circle', 'nicht belegt'], crit: ['#ff727f', 'mdi:close-octagon', 'nicht ändern'] };
        const blocks = ROWS.map((r) => { const s = ST[r[7]];
          return '<div class="b" style="--c:' + s[0] + '"><div class="bh"><span class="pn">' + r[1] + '</span><div class="bt"><b>' + r[2] + '</b><small>' + r[0] + '</small><span class="st"><ha-icon icon="' + s[1] + '"></ha-icon>' + s[2] + '</span></div></div>'
            + '<div class="vals"><div><small>Werk</small><b>' + r[3] + '</b></div><div><small>Zielwert</small><b>' + r[4] + '</b></div><div><small>risikoarm</small><b>' + r[5] + '</b></div></div>'
            + '<div class="ef">' + r[6] + '</div><div class="ab"><ha-icon icon="mdi:link-variant"></ha-icon><div>' + r[8] + '</div></div></div>'; }).join('');
        return '<div class="tw"><div class="hd"><ha-icon icon="mdi:table-search"></ha-icon><span class="h">Tabelle „Optimierung gegen das Takten“ – Abgleich mit dieser Anlage</span></div>'
          + '<div class="wa"><ha-icon icon="mdi:alert"></ha-icon><div><b>Die P-Nummern dieser Tabelle stammen aus einer anderen Parameterliste.</b> Abgeglichen mit dem Hofman-Handbuch HE-AI-290, Rev. 01, Parametertabelle S. 77–81 (Spalte 12 kW): nur <b>P46, P114 und P60</b> stimmen in der Bedeutung überein; <b>P32 regelt das Expansionsventil</b> und darf nicht verändert werden. Werte nicht nach Nummer übertragen; über Home Assistant änderbar sind nur die Parameter oben im Tab.</div></div>'
          + '<div class="g">' + blocks + '</div><div class="ft">Zielwerte und „risikoarm“ stammen aus den beiden übergebenen Tabellen – Empfehlungen Dritter, keine Herstellerfreigabe. Änderungen einzeln vornehmen und die Wirkung im Tab „Parameter-Wirkung“ prüfen.</div></div>';
        ]]]
    extra_styles: |-
      .tw{font-family:Inter,Roboto,"Segoe UI",sans-serif;color:#f0f7ff;text-align:left}
      .hd{display:flex;align-items:center;gap:10px;margin:0 2px 10px}.hd ha-icon{--mdc-icon-size:26px;color:#3ac8ef;flex:none}.h{font-size:19px;font-weight:800;line-height:1.25}
      .wa{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:#2a2412;border:1px solid #7a6230;font-size:13.5px;line-height:1.45;margin-bottom:12px}.wa ha-icon{color:#ffbf55;flex:none;--mdc-icon-size:22px}
      .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
      .b{background:#16263d;border:1px solid #284263;border-radius:14px;padding:11px 12px}
      .bh{display:flex;align-items:flex-start;gap:10px}
      .pn{flex:none;min-width:44px;text-align:center;padding:5px 6px;border-radius:9px;background:#0f1a2b;border:1px solid #2a3b55;font-size:13px;font-weight:800;color:#3ac8ef}
      .bt{flex:1;min-width:0}.bt b{display:block;font-size:14.5px;line-height:1.25;overflow-wrap:anywhere}.bt small{font-size:11.5px;color:#7f93ae}
      .st{display:flex;margin-top:4px;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--c);white-space:nowrap}.st ha-icon{--mdc-icon-size:16px}
      .vals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
      .vals div{background:#0f1a2b;border-radius:10px;padding:6px 8px;min-width:0}.vals small{display:block;font-size:11px;color:#7f93ae}.vals b{font-size:13.5px}
      .ef{font-size:12.5px;color:#9fb3cc;margin-top:8px;line-height:1.4}
      .ab{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding-top:8px;border-top:1px solid #243650;font-size:13px;line-height:1.4;color:#dbe6f5}.ab ha-icon{--mdc-icon-size:18px;color:var(--c);flex:none;margin-top:1px}
      .ft{margin-top:10px;font-size:12px;font-style:italic;color:#91a5c0}
  av_diag_hint:
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    tap_action:
      action: navigate
      navigation_path: /dashboard-waermepumpe-neu/diagnose
    hold_action:
      action: none
    triggers_update:
      - sensor.avarma_kk_diagnosestatus
      - sensor.avarma_mq_sh_median_5_min
      - input_number.avarma_sh_diagnoseschwelle
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - padding: 0px
      grid:
        - grid-template-areas: "\"bn\""
        - grid-template-columns: 1fr
      custom_fields:
        bn:
          - width: 100%
    custom_fields:
      bn: |-
        [[[
        const S = (e) => (states[e] ? states[e].state : 'unavailable');
        const N = (e, d) => { const v = parseFloat(S(e)); return isNaN(v) ? '–' : v.toFixed(d).replace('.', ','); };
        const st = S('sensor.avarma_kk_diagnosestatus');
        const M = {
          'Herstelleralarm': ['#ff727f', '#2a1216', 'mdi:alert-octagon', 'Herstelleralarm aktiv', 'Alarm/Fehler der Anlage hat Vorrang vor jeder eigenen Bewertung.'],
          'Prüfen: Messkette': ['#ffbf55', '#2a2110', 'mdi:clipboard-alert-outline', 'Prüfen: Messkette / Überhitzung', 'Überhitzung im stabilen Heizbetrieb bestätigt unter Schwelle. Offene technische Prüfung, keine Störungsmeldung.'],
          'Beobachtung': ['#ffd27a', '#262010', 'mdi:eye-outline', 'Beobachtung: Überhitzung niedrig', 'Median 5 min unter Schwelle, Bestätigungsdauer noch nicht erreicht.'],
          'Messqualität unklar': ['#b5a0ff', '#1d1a2e', 'mdi:help-network-outline', 'Messqualität unklar', 'Messwerte fehlen, sind veraltet oder ESP32 offline. Keine Bewertung möglich.'],
          'nicht bewertbar': ['#91a5c0', '#1a2433', 'mdi:timer-sand', 'Nicht bewertbar (Übergang)', 'Start, Abtauung, Frequenzwechsel oder kein Heizbetrieb. Stabilisierung abwarten.'],
          'inaktiv': ['#91a5c0', '#1a2433', 'mdi:power-sleep', 'Verdichter aus', 'Keine Kältekreisbewertung.'],
          'unauffällig': ['#48d18c', '#10291d', 'mdi:check-circle-outline', 'Diagnose unauffällig', 'Stabiler Heizbetrieb, Überhitzung-Median nicht unter Schwelle.']
        };
        const c = M[st] || ['#91a5c0', '#1a2433', 'mdi:help-circle-outline', 'Diagnosestatus unbekannt', ''];
        let sub = c[4];
        if (['Prüfen: Messkette', 'Beobachtung', 'unauffällig'].includes(st)) sub += ' SH Median 5 min: ' + N('sensor.avarma_mq_sh_median_5_min', 1) + ' K · Schwelle: ' + N('input_number.avarma_sh_diagnoseschwelle', 1) + ' K';
        return '<div class="bn" style="border-color:' + c[0] + ';background:' + c[1] + '"><ha-icon icon="' + c[2] + '" style="color:' + c[0] + '"></ha-icon><div><div class="b1">' + c[3] + '</div><div class="b2">' + sub + '</div><div class="b3">Experimentelle Auswertung · keine Herstellerfreigabe · ersetzt keine Schutzfunktion</div></div></div>';
        ]]]
    extra_styles: |-
      .bn{display:flex;align-items:center;gap:14px;border:1.5px solid;border-radius:16px;padding:12px 16px;font-family:Inter,Roboto,"Segoe UI",sans-serif;color:#f0f7ff;text-align:left}
      .bn ha-icon{--mdc-icon-size:32px;flex:none}.b1{font-size:16px;font-weight:800}.b2{font-size:13.5px;color:#c9d7ea;margin-top:2px;line-height:1.35}.b3{font-size:11.5px;color:#91a5c0;margin-top:4px}
  av_lernband:
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    triggers_update:
      - binary_sensor.avarma_mq_stabiler_heizbetrieb
      - sensor.avarma_mq_sh_median_5_min
      - sensor.avarma_mq_sc_median_5_min
      - sensor.avarma_mq_hub_median_5_min
      - sensor.avarma_mq_luftverd_median_5_min
      - sensor.avarma_mq_kondvl_median_5_min
      - sensor.avarma_mq_spreizung_median_5_min
      - sensor.avarma_lernband_sh_p10
      - sensor.avarma_lernband_sh_p90
      - sensor.avarma_lernband_sc_p10
      - sensor.avarma_lernband_sc_p90
      - sensor.avarma_lernband_hub_p10
      - sensor.avarma_lernband_hub_p90
      - sensor.avarma_lernband_luftverd_p10
      - sensor.avarma_lernband_luftverd_p90
      - sensor.avarma_lernband_kondvl_p10
      - sensor.avarma_lernband_kondvl_p90
      - sensor.avarma_lernband_spreizung_p10
      - sensor.avarma_lernband_spreizung_p90
      - sensor.avarma_sh_soll_hersteller
    styles:
      card:
        - background: "#111d30"
        - border: "1px solid #2a3b55"
        - border-radius: 18px
        - padding: 14px
        - box-shadow: none
      grid:
        - grid-template-areas: "\"lb\""
        - grid-template-columns: 1fr
      custom_fields:
        lb:
          - width: 100%
    custom_fields:
      lb: |-
        [[[
        const S = (e) => (states[e] ? states[e].state : 'unavailable');
        const V = (e) => parseFloat(S(e));
        const f = (v) => isNaN(v) ? '–' : v.toFixed(1).replace('.', ',');
        const stab = S('binary_sensor.avarma_mq_stabiler_heizbetrieb') === 'on';
        const R = [
          ['sh', 'Überhitzung SH', 'Ts − Te', true],
          ['sc', 'Unterkühlung SC', 'Tk − Ty', false],
          ['hub', 'Temperaturhub', 'Tk − Te', false],
          ['luftverd', 'Luft − Verdampfung', 'Außen − Te', false],
          ['kondvl', 'Kondensation − VL', 'Tk − VL', false],
          ['spreizung', 'Spreizung', 'VL − RL', false]
        ];
        let h = '<div class="hd"><ha-icon icon="mdi:chart-box-outline"></ha-icon>Normalbereich und Lernband – getrennt geführt</div>';
        h += '<div class="nt">Lernband = P10–P90 der eigenen Messwerte im stabilen Heizbetrieb (7 Tage, lernend). Es ist eine statistische Häufigkeit, <b>kein technisch sicherer Normalbereich und keine Freigabe</b>. Die Lage im Lernband wird deshalb neutral (blau/violett) und nicht als Ampelfarbe dargestellt.</div>';
        h += '<div class="tw"><table><thead><tr><th>Kennwert</th><th>Median 5 min</th><th>Lernband P10–P90</th><th>Lage</th><th>Lernbasis</th><th>Herstellervorgabe</th></tr></thead><tbody>';
        R.forEach((r) => {
          const m = V('sensor.avarma_mq_' + r[0] + '_median_5_min');
          const e10 = 'sensor.avarma_lernband_' + r[0] + '_p10', e90 = 'sensor.avarma_lernband_' + r[0] + '_p90';
          const p10 = V(e10), p90 = V(e90);
          const cov = states[e90] ? parseFloat(states[e90].attributes.age_coverage_ratio) : NaN;
          let lage = '<span class="g">–</span>';
          if (stab && !isNaN(m) && !isNaN(p10) && !isNaN(p90)) {
            lage = m < p10 ? '<span class="o">unter Lernband</span>' : (m > p90 ? '<span class="o">über Lernband</span>' : '<span class="i">im Lernband</span>');
          }
          const lb = isNaN(cov) ? '–' : Math.round(Math.min(cov, 1) * 100) + ' %' + (cov < 1 ? ' <span class="g">lernend</span>' : '');
          const so = V('sensor.avarma_sh_soll_hersteller');
          const nb = r[3] ? ('Soll ' + f(so) + ' K <span class="g">(P92–P96, Regelziel, kein Grenzwert)</span><div class="w">Ursache negativer Werte offen</div>') : '<span class="g">keine Vorgabe</span>';
          h += '<tr><td><b>' + r[1] + '</b><div class="g">' + r[2] + '</div></td><td class="n">' + (stab ? f(m) + ' K' : '<span class="g">nicht bewertbar</span>') + '</td><td class="n">' + f(p10) + ' … ' + f(p90) + ' K</td><td>' + lage + '</td><td>' + lb + '</td><td>' + nb + '</td></tr>';
        });
        h += '</tbody></table></div>';
        h += '<div class="nt">Werte nur aus Minuten mit „Stabiler Heizbetrieb“ (Messdaten OK, Lauf ≥ Stabilisierung, Abstand zur Abtauung, Hz-Spanne ≤ Toleranz). Medianwerte werden in Phasen ohne stabilen Betrieb nicht bewertet.</div>';
        return h;
        ]]]
    extra_styles: |-
      .hd{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;color:#f0f7ff;margin:2px 2px 8px;font-family:Inter,Roboto,"Segoe UI",sans-serif;text-align:left}
      .hd ha-icon{--mdc-icon-size:24px;color:#c9d7ea}
      .nt{font-size:13px;color:#c9d7ea;line-height:1.4;margin:4px 2px 10px;font-family:Inter,Roboto,"Segoe UI",sans-serif;text-align:left}
      .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
      table{width:100%;border-collapse:collapse;font-family:Inter,Roboto,"Segoe UI",sans-serif;font-size:14px;color:#f0f7ff;text-align:left;min-width:560px}
      th{font-size:12px;color:#91a5c0;font-weight:700;padding:6px 8px;border-bottom:1px solid #2a3b55;white-space:nowrap}
      td{padding:8px;border-bottom:1px solid #1d2b40;vertical-align:top}
      td.n{white-space:nowrap;font-weight:700}
      .g{color:#91a5c0;font-size:12px;font-weight:400}.i{color:#4c9eff;font-weight:700}.o{color:#b5a0ff;font-weight:700}.w{color:#ffbf55;font-weight:700;font-size:12.5px}
background:
  image: data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' preserveAspectRatio='none'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23122036'/><stop offset='0.55' stop-color='%230b1424'/><stop offset='1' stop-color='%23080e19'/></linearGradient></defs><rect width='32' height='32' fill='url(%23g)'/></svg>
  size: cover
