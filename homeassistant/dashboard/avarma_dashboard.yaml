      .sum{display:flex;align-items:center;gap:10px;padding:10px 26px;border:2px solid var(--c);border-radius:12px;background:color-mix(in srgb,var(--c) 12%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--c) 35%,transparent),inset 0 0 12px color-mix(in srgb,var(--c) 12%,transparent);font-size:17px;font-weight:600}
      .sum ha-icon{color:var(--c);--mdc-icon-size:26px}.sum.off{box-shadow:none}
      .exp{display:none;margin:0 4px 12px;padding:10px 14px;border:1px solid #2a4566;border-radius:12px;background:rgba(10,20,36,.6);font-size:13.5px;line-height:1.5;color:#c9d7ea}
      .tg:checked~.exp{display:block}.tg:checked~.top .inf{background:#b8c7da;color:#0d1828}
      .tb{border:1px solid #233a58;border-radius:16px;background:rgba(8,16,30,.45);padding:4px 10px 6px}
      .r{display:grid;grid-template-columns:52px minmax(150px,1.7fr) minmax(80px,1fr) minmax(70px,.75fr) minmax(110px,1.15fr) minmax(200px,auto);align-items:center;column-gap:14px;min-height:56px;border-bottom:1px solid #1e3350;cursor:pointer}
      .r:last-child{border-bottom:none}.r:not(.h):hover{background:rgba(58,200,239,.05)}
      .r.h{min-height:46px;cursor:default;color:#cfe0f5;font-size:16px;font-weight:600}.r.h .va{text-align:left;font-size:16px;font-weight:600}
      .ic{width:46px;height:42px;border-radius:9px;background:linear-gradient(180deg,#1b2d47,#132238);border:1px solid #284263;display:flex;align-items:center;justify-content:center}
      .ic ha-icon{color:var(--c);--mdc-icon-size:26px;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--c) 60%,transparent))}
      .nm{font-size:19px;font-weight:700;line-height:1.2}.nm small{display:none;font-size:12.5px;font-weight:500;color:#91a5c0;margin-top:2px}
      .r.h .nm{font-size:16px;font-weight:600}
      .fo,.rw{font-size:17px;color:#cfdcec}.va{font-size:20px;font-weight:800;white-space:nowrap}.va.dim{color:#91a5c0;font-weight:600}
      .st{display:flex;align-items:center;gap:22px}
      .led{width:22px;height:22px;border-radius:50%;flex:none;background:radial-gradient(circle at 38% 34%,#ffffff 0 8%,var(--c) 42%,color-mix(in srgb,var(--c) 70%,#000) 100%);box-shadow:0 0 8px var(--c),0 0 18px color-mix(in srgb,var(--c) 55%,transparent)}
      .led.off{box-shadow:0 0 6px rgba(201,211,224,.35)}
      .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 14px 4px 10px;border:2px solid var(--c);border-radius:11px;color:#eaf6ee;background:color-mix(in srgb,var(--c) 10%,transparent);font-size:15px;font-weight:600;white-space:nowrap}
      .pill ha-icon{--mdc-icon-size:20px;color:#fff}.pill.off{color:#b8c4d4;border-color:#5c6b80}
      .led.warn,.pill.warn,.sum.warn{animation:avP 2.4s ease-in-out infinite}
      .led.crit,.pill.crit,.sum.crit{animation:avB .64s steps(1,end) infinite}
      @keyframes avP{0%,100%{opacity:1}50%{opacity:.55}}@keyframes avB{0%,48%{opacity:1}50%,96%{opacity:.25}100%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.led,.pill,.sum{animation:none!important}}
      .lg{display:grid;grid-template-columns:repeat(4,1fr);margin:16px 4px 2px;padding-top:16px;border-top:1px solid #2a4566}
      .li{display:flex;align-items:flex-start;gap:14px;padding:4px 18px;border-left:1px solid #2a4566}.li:first-child{border-left:none}
      .li .led{margin-top:6px;width:28px;height:28px}.li b{display:block;font-size:17px}.li span{font-size:14.5px;color:#c9d7ea;line-height:1.35}
      @container (max-width:860px){.r{grid-template-columns:44px minmax(0,1fr) auto auto;column-gap:10px;min-height:60px}.fo,.rw{display:none}.nm small{display:block}.nm{font-size:16px}.va{font-size:18px}.st{gap:10px}.pill{font-size:13px;padding:3px 10px 3px 8px}.h1{font-size:24px}.lg{grid-template-columns:1fr 1fr;row-gap:12px}.li:nth-child(3){border-left:none}}
      @container (max-width:520px){.r{grid-template-columns:40px minmax(0,1fr) auto auto}.pill{display:none}.ic{width:38px;height:36px}.sum{width:100%;padding:8px 14px;font-size:15px}.li{padding:4px 8px}.li span{font-size:13px}}
  av_ampel_bar:
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    hold_action:
      action: none
    triggers_update:
      - sensor.avarma_status_uberhitzung
      - sensor.avarma_status_unterkuhlung
      - sensor.avarma_status_temperaturhub
      - sensor.avarma_status_luft_verdampfung
      - sensor.avarma_status_kondensation_vorlauf
      - sensor.avarma_status_spreizung
      - sensor.avarma_uberhitzung
      - sensor.avarma_unterkuhlung
      - sensor.avarma_temperaturhub
      - sensor.avarma_luft_verdampfung
      - sensor.avarma_kondensation_vorlauf
      - sensor.avarma_spreizung
