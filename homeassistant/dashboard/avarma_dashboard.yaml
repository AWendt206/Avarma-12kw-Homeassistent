            entity: binary_sensor.hausinstallation_avarma_status
            state: "off"
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:button-card
            template: av_diag_hint
            grid_options:
              columns: full
          - type: markdown
            card_mod:
              style: "ha-card { background: #111d30 !important; border: 1px solid #2a3b55 !important; border-radius: 18px !important; color: #f0f7ff; box-shadow: none !important; backdrop-filter: none !important; }"
            grid_options:
              columns: full
            content: |-
              **Experimentell.** Eigene Datenanalyse, keine Herstellerbewertung. Verändert **keine** Anlagen- oder P-Parameter und ersetzt keine Schutzfunktion.

              **Herstellersollwert:** Laut Betriebsanleitung (HE-AI-290, Rev. 01, S. 80) regelt das EEV (P32 = 3, Sauggasüberhitzung) beim Heizen auf **0,5 K** (P92/P93/P94/P96, je nach Außentemperatur; Kühlen P95 = 3,0 K). Ein Messwert um 0 K ist daher **kein** Fehler an sich. Der Sollwert ist ein Regelziel, **kein Grenzwert** – eine rote Schwelle gibt der Hersteller nicht an, sie wird hier auch nicht erfunden.

              **Messunsicherheit:** Te kommt in 0,5-K-Schritten, Ts und Te werden nicht gleichzeitig aktualisiert. Abweichungen bis etwa ±1 K vom Soll sind messtechnisch nicht auflösbar. Gelb erst bei länger anhaltender negativer Überhitzung im stabilen Heizbetrieb (Bestätigungsdauer einstellbar). Ursachenklärung nur durch eine R290-Fachkraft; keine Experimente an der EEV-Regelung (P89–P96).
