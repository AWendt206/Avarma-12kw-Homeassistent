    custom_fields:
      s: |-
        [[[
        const S = (id) => (states[id] ? states[id].state : 'unavailable');
        const V = (id) => parseFloat(S(id));
        const N = (id, d, u) => { const v = V(id); return isNaN(v) ? '–' : v.toFixed(d).replace('.', ',') + (u ? ' ' + u : ''); };
        const P = 'sensor.hausinstallation_avarma_';
        const run = S('binary_sensor.avarma_verdichter_lauft') === 'on';
        const mode = S('sensor.avarma_visueller_modus');
        const def = mode === 'abtauen';
        const fan = V(P + 'lufter_1_drehzahl') > 0;
        const HOT = '#ff4b3e', LIQ = '#ffa13d', LOW = '#4c9eff', SUC = '#3ac8ef';
        const pipe = (d, c, cls) => '<path d="' + d + '" class="pp" stroke="' + c + '"/><path d="' + d + '" class="fl' + (run ? ' on' : '') + (cls || '') + '" stroke="' + c + '"/>';
        const arrow = (x, y, r, c) => '<path d="M-7 -6 L5 0 L-7 6 Z" fill="' + c + '" transform="translate(' + x + ' ' + y + ') rotate(' + r + ')"/>';
        const tx = (x, y, s, cls, a) => '<text x="' + x + '" y="' + y + '" class="' + (cls || 'v') + '"' + (a ? ' text-anchor="' + a + '"' : '') + '>' + s + '</text>';
        let blades = '';
        for (let a = 0; a < 360; a += 90) blades += '<path d="M0 -2 C 7 -4, 16 -12, 15 -20 C 9 -21, 3 -12, 0 -2 Z" fill="#9fb3cc" transform="rotate(' + a + ')"/>';
        let g = '<svg viewBox="0 0 640 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kältekreis-Schema">';
        g += tx(320, 22, 'HOCHDRUCKSEITE', 'zone hz', 'middle') + tx(320, 404, 'NIEDERDRUCKSEITE', 'zone nz', 'middle');
        // Rohrleitungen: Heißgas (oben), Flüssig (rechts), nach EEV (unten), Sauggas (links)
        g += pipe('M152 95 H400', HOT) + pipe('M560 145 V218', LIQ) + pipe('M560 262 V330 H260', LOW) + pipe('M110 270 V137', SUC);
        g += arrow(300, 95, 0, HOT) + arrow(560, 190, 90, LIQ) + arrow(420, 330, 180, LOW) + arrow(110, 205, -90, SUC);
        // Verdichter
        g += '<circle cx="110" cy="95" r="42" class="box" stroke="' + HOT + '"/><path d="M84 75 L136 88 L136 102 L84 115 Z" fill="none" stroke="#dbe6f5" stroke-width="2.5" stroke-linejoin="round"/>';
        g += tx(110, 32, 'Verdichter', 't', 'middle') + tx(168, 124, N(P + 'verdichterfrequenz_ist', 0, 'Hz') + ' · ' + N(P + 'verdichterstrom', 1, 'A'), 'v sm');
        g += tx(276, 82, 'Heißgas Td ' + N(P + 'heissgastemperatur', 1, '°C'), 'v', 'middle');
