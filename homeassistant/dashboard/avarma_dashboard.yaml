        rm:
          - width: 100%
    custom_fields:
      rm: |-
        [[[
        const V = (id) => parseFloat(states[id] ? states[id].state : 'nan');
        const f = (v, d) => isNaN(v) ? '–' : v.toFixed(d).replace('.', ',');
        const rooms = [['mdi:sofa', 'Wohnzimmer', 'sensor.avarma_raum1_temperatur', 'sensor.avarma_raum1_luftfeuchte'], ['mdi:desk', 'Büro', 'sensor.avarma_raum2_temperatur', 'sensor.avarma_raum2_luftfeuchte']];
        return '<div class="rm"><div class="rh"><ha-icon icon="mdi:home-thermometer-outline"></ha-icon>Räume</div><div class="rg">' + rooms.map((r) => '<div class="rb"><ha-icon icon="' + r[0] + '"></ha-icon><div><div class="rn">' + r[1] + '</div><div class="rv">' + f(V(r[2]), 1) + ' °C · ' + f(V(r[3]), 0) + ' %</div></div></div>').join('') + '</div></div>';
        ]]]
    extra_styles: |-
      .rm{color:#f0f7ff;font-family:Inter,Roboto,"Segoe UI",sans-serif;text-align:left}
      .rh{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin-bottom:10px}.rh ha-icon{--mdc-icon-size:22px;color:#c9d7ea}
      .rg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
      .rb{display:flex;align-items:center;gap:10px;background:#0d1727;border:1px solid #22324a;border-radius:12px;padding:10px 12px}
      .rb ha-icon{--mdc-icon-size:26px;color:#4c9eff;flex:none}
      .rn{font-size:15px;font-weight:700}.rv{font-size:14px;color:#c9d7ea;white-space:nowrap}
  av_tiles:
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
        - background: "#111d30"
        - border: "1px solid #2a3b55"
        - border-radius: 18px
        - padding: 14px
        - box-shadow: none
      grid:
        - grid-template-areas: "\"tl\""
        - grid-template-columns: 1fr
      custom_fields:
        tl:
          - width: 100%
    custom_fields:
      tl: |-
        [[[
        const items = variables.items || [];
        const f = (v, d) => isNaN(v) ? '–' : v.toFixed(d).replace('.', ',');
        const val = (it) => {
          const st = states[it.e];
          if (!st || st.state === 'unavailable' || st.state === 'unknown') return '–';
          const s = st.state;
          if (it.fmt === 'onoff') return s === 'on' ? (it.on || 'Ein') : (s === 'off' ? (it.off || 'Aus') : s);
          if (it.fmt === 'text') return it.map && it.map[s] ? it.map[s] : s;
          const v = parseFloat(s);
          if (it.fmt === 'hm') return isNaN(v) ? '–' : Math.floor(v) + ' h ' + Math.round((v - Math.floor(v)) * 60) + ' min';
          return f(v, it.d || 0) + (it.u ? ' ' + it.u : '');
        };
        const col = (it) => {
          const st = states[it.e];
          if (it.fmt === 'onoff' && st && it.alarm) return st.state === 'on' ? '#ff727f' : '#48d18c';
          return it.c || '#4c9eff';
        };
        let h = '';
        if (variables.title) h += '<div class="hd"><ha-icon icon="' + (variables.icon || 'mdi:information-outline') + '"></ha-icon>' + variables.title + '</div>';
        h += '<div class="tg" style="grid-template-columns:repeat(auto-fill,minmax(' + (variables.minw || 150) + 'px,1fr))">';
        items.forEach((it) => {
          const c = col(it);
          h += '<div class="t"><div class="ic" style="color:' + c + ';background:' + c + '22"><ha-icon icon="' + it.i + '"></ha-icon></div><div class="tx"><div class="l">' + it.l + '</div><div class="v"' + (it.fmt === 'onoff' && it.alarm ? ' style="color:' + c + '"' : '') + '>' + val(it) + '</div></div></div>';
        });
        return h + '</div>';
        ]]]
    extra_styles: |-
      .hd{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;color:#f0f7ff;margin:2px 2px 12px;font-family:Inter,Roboto,"Segoe UI",sans-serif;text-align:left}
      .hd ha-icon{--mdc-icon-size:24px;color:#c9d7ea}
      .tg{display:grid;gap:10px;font-family:Inter,Roboto,"Segoe UI",sans-serif;text-align:left}
      .t{display:flex;align-items:center;gap:12px;background:#0d1727;border:1px solid #22324a;border-radius:14px;padding:10px 12px;min-height:56px}
      .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
      .ic ha-icon{--mdc-icon-size:24px}
      .tx{min-width:0}.l{font-size:13px;color:#c9d7ea;line-height:1.25}.v{font-size:17px;font-weight:800;color:#f0f7ff;white-space:nowrap}
  av_gauges:
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
        - background: "#111d30"
        - border: "1px solid #2a3b55"
        - border-radius: 18px
        - padding: 14px
        - box-shadow: none
      grid:
        - grid-template-areas: "\"ga\""
        - grid-template-columns: 1fr
      custom_fields:
        ga:
          - width: 100%
    custom_fields:
      ga: |-
        [[[
        const gs = variables.gauges || [];
        const f = (v, d) => isNaN(v) ? '–' : v.toFixed(d).replace('.', ',');
        let h = '<div class="gw">';
        gs.forEach((g, i) => {
          const st = states[g.e];
          const v = st ? parseFloat(st.state) : NaN;
          const fr = isNaN(v) ? 0 : Math.max(0, Math.min(1, (v - g.min) / (g.max - g.min)));
          const a = Math.PI * (1 - fr);
          const x = 90 + 68 * Math.cos(a), y = 92 - 68 * Math.sin(a);
          const id = 'gg' + i + (variables.gid || '');
          const stops = g.invert ? ['#48d18c', '#ffbf55', '#ff4b3e'] : ['#ff4b3e', '#ffbf55', '#48d18c'];
          h += '<div class="g"><svg viewBox="0 0 180 112" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="' + stops[0] + '"/><stop offset=".5" stop-color="' + stops[1] + '"/><stop offset="1" stop-color="' + stops[2] + '"/></linearGradient></defs>'
            + '<path d="M22 92 A68 68 0 0 1 158 92" fill="none" stroke="#1d2a3d" stroke-width="16" stroke-linecap="round"/>'
            + '<path d="M22 92 A68 68 0 0 1 158 92" fill="none" stroke="url(#' + id + ')" stroke-width="14" stroke-linecap="round"/>'
            + (isNaN(v) ? '' : '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="9" fill="#f0f7ff" stroke="#0b1322" stroke-width="3"/>')
            + '<text x="90" y="86" text-anchor="middle" font-size="30" font-weight="800" fill="#f0f7ff" font-family="Inter,Arial,sans-serif">' + f(v, g.d || 0) + (g.u ? '<tspan font-size="16" font-weight="700"> ' + g.u + '</tspan>' : '') + '</text>'
            + '</svg><div class="gl">' + g.l + '</div></div>';
        });
        return h + '</div>';
        ]]]
    extra_styles: |-
      .gw{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;font-family:Inter,Roboto,"Segoe UI",sans-serif}
      .g{background:#0d1727;border:1px solid #22324a;border-radius:16px;padding:10px 8px 12px;text-align:center}
      .g svg{width:100%;max-width:220px;height:auto;display:block;margin:0 auto}
      .gl{font-size:14px;color:#c9d7ea;margin-top:-4px}
