button_card_templates:
  av_ampel_row:
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    styles:
      card:
        - background: "#111d30"
        - border: "1px solid #2a3b55"
        - border-radius: 14px
        - padding: 6px 14px
        - container-type: inline-size
        - box-shadow: none
      grid:
        - grid-template-areas: "\"row\""
        - grid-template-columns: 1fr
      custom_fields:
        row:
          - width: 100%
    custom_fields:
      row: |-
        [[[
        const st = states[variables.status] ? states[variables.status].state : 'unbekannt';
        const vs = states[variables.value];
        const v = vs ? parseFloat(vs.state) : NaN;
        const map = {
          ok: ['#48d18c', 'Im Richtwert', 'led-ok', ''],
          warnung: ['#ffbf55', 'Beobachten', 'led-warn', '!'],
          kritisch: ['#ff727f', 'Deutlich daneben', 'led-crit', '!'],
          ohne_grenze: ['#91a5c0', 'Kein validierter Grenzwert', 'led-off', ''],
          inaktiv: ['#91a5c0', 'Nicht bewertbar', 'led-off', ''],
          unbekannt: ['#91a5c0', 'Keine Daten', 'led-off', '']
        };
        const m = map[st] || map.unbekannt;
        const shown = ['ok', 'warnung', 'kritisch', 'ohne_grenze'].indexOf(st) >= 0 && !isNaN(v);
        const val = shown ? v.toFixed(1).replace('.', ',') + ' K' : '—';
        const colored = ['ok', 'warnung', 'kritisch'].indexOf(st) >= 0;
        return '<div class="row"><div class="ic">' + variables.tag + '</div>'
          + '<div class="nm"><div class="t">' + variables.name + '</div><div class="f">' + variables.formel + '</div></div>'
          + '<div class="val' + (shown ? '' : ' dim') + '">' + val + '</div>'
          + '<div class="rw">' + variables.richtwert + '</div>'
          + '<div class="st"><span class="led ' + m[2] + '" style="background:' + m[0] + (colored ? ';box-shadow:0 0 ' + (st === 'ok' ? '5px ' : '10px ') + m[0] : '') + '">' + m[3] + '</span>'
          + '<span class="lb" style="color:' + (colored ? m[0] : '#91a5c0') + '">' + m[1] + '</span></div></div>';
        ]]]
    extra_styles: |-
      .row{display:grid;grid-template-columns:50px minmax(140px,1.5fr) minmax(70px,.8fr) minmax(110px,1.1fr) minmax(170px,1.4fr);grid-template-areas:"ic nm val rw st";align-items:center;column-gap:14px;min-height:64px;padding:4px 2px;color:#f0f7ff;font-family:Inter,Roboto,"Segoe UI",sans-serif;text-align:left}
      .ic{grid-area:ic;width:46px;height:38px;border-radius:10px;background:#16263d;border:1px solid #2a3b55;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#3ac8ef}
      .nm{grid-area:nm;min-width:0}.t{font-size:16px;font-weight:700;line-height:1.2}.f{font-size:13px;color:#91a5c0;margin-top:3px}
      .val{grid-area:val;font-size:24px;font-weight:800;text-align:right;white-space:nowrap}.val.dim{color:#91a5c0;font-weight:600}
      .rw{grid-area:rw;font-size:13px;color:#91a5c0}
      .st{grid-area:st;display:flex;align-items:center;gap:10px}
      .led{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#1b1f23;flex:none}
      .lb{font-size:13px;font-weight:700;white-space:nowrap}
      .led-warn{animation:avAmberPulse 2.4s ease-in-out infinite}
      .led-crit{animation:avRedBlink .64s steps(1,end) infinite}
      @keyframes avAmberPulse{0%,100%{opacity:1}50%{opacity:.55}}
      @keyframes avRedBlink{0%,48%{opacity:1}50%,96%{opacity:.18}100%{opacity:1}}
      @media (prefers-reduced-motion: reduce){.led{animation:none !important;opacity:1 !important}}
      @container (max-width: 560px){.row{grid-template-columns:44px 1fr auto;grid-template-areas:"ic nm val" "ic rw st";row-gap:6px;min-height:76px}.val{font-size:22px}.st{justify-content:flex-end}.lb{font-size:12px}}
  av_schema:
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    triggers_update:
      - sensor.hausinstallation_avarma_aussentemperatur
      - sensor.hausinstallation_avarma_lufter_1_drehzahl
      - sensor.hausinstallation_avarma_niederdruck
      - sensor.hausinstallation_avarma_sauggastemperatur
      - sensor.hausinstallation_avarma_hochdruck
      - sensor.hausinstallation_avarma_heissgastemperatur
      - sensor.hausinstallation_avarma_verdichterfrequenz_ist
      - sensor.hausinstallation_avarma_verdichterstrom
      - sensor.hausinstallation_avarma_expansionsventil_schritte
      - sensor.hausinstallation_avarma_lamellentemperatur
      - sensor.hausinstallation_avarma_verdampfungstemperatur
      - sensor.hausinstallation_avarma_kondensationstemperatur
      - sensor.hausinstallation_avarma_vorlauftemperatur
      - sensor.hausinstallation_avarma_wasserdurchfluss
      - sensor.hausinstallation_avarma_rucklauftemperatur
      - sensor.avarma_spreizung
      - sensor.avarma_visueller_modus
      - binary_sensor.avarma_verdichter_lauft
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - padding: 0px
        - overflow: hidden
        - border-radius: 22px
      grid:
        - grid-template-areas: "\"svg\""
        - grid-template-columns: 1fr
      custom_fields:
        svg:
          - width: 100%
    custom_fields:
      svg: |-
        [[[
        const S = (id) => (states[id] ? states[id].state : 'unavailable');
        const V = (id) => parseFloat(S(id));
        const N = (id, d, u) => { const v = V(id); return isNaN(v) ? '–' : v.toFixed(d).replace('.', ',') + (u ? ' ' + u : ''); };
        const P = 'sensor.hausinstallation_avarma_';
        const mode = S('sensor.avarma_visueller_modus');
        const run = S('binary_sensor.avarma_verdichter_lauft') === 'on' && mode !== 'offline';
        const fanOn = V(P + 'lufter_1_drehzahl') > 0;
        const defr = mode === 'abtauen';
        const dim = run ? 1 : 0.55;
        const MB = {heizen: ['HEIZEN', '#48d18c'], abtauen: ['ABTAUEN', '#ffbf55'], standby: ['STANDBY', '#91a5c0'], aus: ['AUS', '#91a5c0'], stoerung: ['STÖRUNG', '#ff727f'], offline: ['OFFLINE', '#ff727f']};
        const mb = MB[mode] || ['UNBEKANNT', '#91a5c0'];
        let o = '<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block" font-family="Inter,Roboto,Segoe UI,Arial,sans-serif">';
        o += '<defs>'
         + '<linearGradient id="nbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14253d"/><stop offset="1" stop-color="#0a1322"/></linearGradient>'
         + '<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d7dee8"/><stop offset=".45" stop-color="#8592a4"/><stop offset="1" stop-color="#3b4757"/></linearGradient>'
         + '<linearGradient id="housing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3646"/><stop offset="1" stop-color="#141c27"/></linearGradient>'
         + '<linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a222d"/><stop offset=".35" stop-color="#4a5869"/><stop offset=".6" stop-color="#2b3644"/><stop offset="1" stop-color="#11171f"/></linearGradient>'
         + '<linearGradient id="cond" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4b3e"/><stop offset=".55" stop-color="#c04fe6"/><stop offset="1" stop-color="#3d8bff"/></linearGradient>'
         + '<linearGradient id="liq" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#5b7cff"/><stop offset="1" stop-color="#a855f7"/></linearGradient>'
         + '<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>'
         + '<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>'
         + '</defs>';
        o += '<rect x="3" y="3" width="1194" height="594" rx="22" fill="url(#nbg)" stroke="#2a3b55" stroke-width="2"/>';
        const pipe = (d, col, w) => {
          let s = '<g opacity="' + dim + '"><path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + (w + 10) + '" stroke-linecap="round" stroke-linejoin="round" opacity=".35" filter="url(#glow)"/>';
          s += '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round" stroke-linejoin="round"/>';
          s += '<path d="' + d + '" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/></g>';
          if (run) s += '<path d="' + d + '" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 22" opacity=".8"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="0.9s" repeatCount="indefinite"/></path>';
          return s;
        };
        const thermo = (x, y, col) => '<g transform="translate(' + x + ' ' + y + ')"><rect x="-4" y="-14" width="8" height="22" rx="4" fill="none" stroke="' + col + '" stroke-width="2.2"/><circle cx="0" cy="12" r="6" fill="' + col + '"/><rect x="-1.4" y="-6" width="2.8" height="16" fill="' + col + '"/></g>';
        const box = (x, y, w, h, lines, border, icol) => {
          let s = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="10" fill="rgba(10,18,32,0.82)" stroke="' + (border || '#3b4f6d') + '" stroke-width="1.6"/>';
          let tx = x + 14;
          if (icol) { s += thermo(x + 22, y + h / 2 - 2, icol); tx = x + 42; }
          lines.forEach((l, i) => {
            const yy = y + (lines.length === 1 ? h / 2 + 7 : 25 + i * 24);
            s += '<text x="' + tx + '" y="' + yy + '" font-size="' + (l[2] || 19) + '" font-weight="' + (l[1] ? 800 : 500) + '" fill="' + (l[3] || '#f0f7ff') + '">' + l[0] + '</text>';
          });
          return s;
        };
        for (let i = 0; i < 3; i++) {
          const y = 250 + i * 55;
          o += '<g opacity="' + (fanOn ? 1 : 0.5) + '"><path d="M28 ' + y + ' Q60 ' + (y - 6) + ' 92 ' + y + '" stroke="#3ab4ff" stroke-width="7" fill="none" stroke-linecap="round" opacity=".35" filter="url(#glow)"/>'
             + '<path d="M28 ' + y + ' Q60 ' + (y - 6) + ' 92 ' + y + '" stroke="#5cc8ff" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M84 ' + (y - 9) + ' L98 ' + y + ' L84 ' + (y + 9) + '" stroke="#5cc8ff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>';
        }
        o += '<path d="M126 172 L92 198 V404 L126 430 Z" fill="#1b2533" stroke="#6f7d90" stroke-width="3" stroke-linejoin="round"/><path d="M126 172 L92 198 V230 L126 204 Z" fill="#3a4757" opacity=".6"/>';
        o += '<rect x="110" y="170" width="262" height="262" rx="22" fill="url(#housing)" stroke="url(#metal)" stroke-width="5"/>';
        o += '<circle cx="185" cy="301" r="66" fill="#0b1018" stroke="#5d6b7d" stroke-width="4"/><circle cx="185" cy="301" r="52" fill="none" stroke="#2c3644" stroke-width="2"/>';
        let blades = '';
        for (let a = 0; a < 360; a += 72) blades += '<path d="M0 -6 C 18 -10, 44 -30, 40 -50 C 24 -52, 10 -30, 0 -6 Z" fill="#8b98aa" transform="rotate(' + a + ')"/>';
        o += '<g transform="translate(185 301)"><g>' + (fanOn && run ? '<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>' : '') + blades + '<circle r="11" fill="#c8d2de"/></g></g>';
        let coil = 'M262 192';
        for (let i = 0; i < 9; i++) { coil += (i % 2 === 0 ? ' H344 a 13 13 0 0 1 0 26' : ' H262 a 13 13 0 0 0 0 26'); }
        o += '<g opacity="' + (defr ? 1 : dim) + '">' + '<path d="' + coil + '" fill="none" stroke="' + (defr ? '#ffbf55' : '#2f9bff') + '" stroke-width="11" opacity=".4" filter="url(#glow)"/>';
        o += '<path d="' + coil + '" fill="none" stroke="' + (defr ? '#ffcf7a' : '#5cc0ff') + '" stroke-width="7" stroke-linecap="round"/>';
        o += '<path d="' + coil + '" fill="none" stroke="#e6f6ff" stroke-width="1.6" opacity=".6"/></g>';
        o += '<text x="300" y="138" text-anchor="middle" font-size="22" font-weight="800" fill="#f0f7ff">Verdampfer</text><text x="300" y="160" text-anchor="middle" font-size="15" fill="#91a5c0">(Luftseite)</text>';
        o += pipe('M372 205 H398 V135 H548', '#ff9a2e', 9);
        o += pipe('M578 160 V228 H470 V292', '#ff9a2e', 8);
        o += pipe('M500 360 H546', '#ff9a2e', 8);
        o += pipe('M630 272 V160', '#ff4b3e', 9);
        o += pipe('M652 135 H886 V212', '#ff4b3e', 9);
        o += pipe('M900 448 V500 H790', 'url(#liq)', 9);
        o += pipe('M720 500 H392 V420 H372', '#a855f7', 9);
        o += pipe('M1012 228 H1092', '#ff4b3e', 9);
        o += pipe('M1092 448 H1012', '#3d8bff', 9);
        const chev = (x, y, ang) => '<g transform="translate(' + x + ' ' + y + ') rotate(' + ang + ')" opacity="' + dim + '"><path d="M-6 -7 L4 0 L-6 7" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>';
        o += chev(470, 135, 0) + chev(398, 175, -90) + chev(578, 196, 90) + chev(520, 360, 0) + chev(630, 216, -90) + chev(770, 135, 0) + chev(900, 474, 90) + chev(842, 500, 180) + chev(560, 500, 180) + chev(392, 460, -90);
        o += '<path d="M1080 216 L1100 228 L1080 240" fill="none" stroke="#ff6a5c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>';
        o += '<path d="M1024 436 L1004 448 L1024 460" fill="none" stroke="#5c9dff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>';
        o += '<rect x="546" y="108" width="108" height="54" rx="12" fill="url(#housing)" stroke="url(#metal)" stroke-width="4"/>';
        o += '<path d="M570 125 H630 M600 125 V150" stroke="#ff9a2e" stroke-width="5" stroke-linecap="round" opacity="' + dim + '"/>';
        o += '<text x="600" y="74" text-anchor="middle" font-size="19" font-weight="700" fill="#f0f7ff">4-Wege-Ventil</text><text x="600" y="96" text-anchor="middle" font-size="15" fill="#91a5c0">(' + (defr ? 'Abtauen' : 'Heizen') + ')</text>';
        o += '<rect x="440" y="292" width="62" height="118" rx="26" fill="url(#cyl)" stroke="#5d6b7d" stroke-width="2.5"/><ellipse cx="471" cy="300" rx="25" ry="7" fill="#5a6878" opacity=".7"/>';
        o += '<text x="471" y="438" text-anchor="middle" font-size="16" fill="#c9d7ea">Speicher</text>';
        o += '<path d="M546 300 Q546 268 600 264 Q654 268 654 300 V430 Q600 446 546 430 Z" fill="url(#cyl)" stroke="#6b788a" stroke-width="3"/>';
        o += '<ellipse cx="600" cy="432" rx="54" ry="9" fill="none" stroke="#ff9a2e" stroke-width="4" opacity="' + (run ? 1 : 0.35) + '" filter="url(#soft)"/>';
        o += '<rect x="564" y="318" width="72" height="72" rx="10" fill="#0a1018" stroke="#3b4f6d" stroke-width="1.5"/>';
        o += '<text x="600" y="348" text-anchor="middle" font-size="21" font-weight="800" fill="#f0f7ff">' + N(P + 'verdichterfrequenz_ist', 0, 'Hz') + '</text>';
        o += '<text x="600" y="376" text-anchor="middle" font-size="19" font-weight="700" fill="#f0f7ff">' + N('sensor.hausinstallation_avarma_verdichterstrom', 1, 'A') + '</text>';
