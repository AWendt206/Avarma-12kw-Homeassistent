      - binary_sensor.avarma_kaltekreis_bewertbar
      - binary_sensor.avarma_verdichter_lauft
    tap_action:
      action: navigate
      navigation_path: /dashboard-waermepumpe-neu/analyse
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - padding: 0px
      grid:
        - grid-template-areas: "\"b\""
        - grid-template-columns: 1fr
      custom_fields:
        b:
          - width: 100%
    custom_fields:
      b: |-
        [[[
        const S = (e) => (states[e] ? states[e].state : 'unbekannt');
        const R = [
          ['sensor.avarma_status_uberhitzung', 'sensor.avarma_uberhitzung', 'Überhitzung', 'mdi:thermometer', '#b39dff'],
          ['sensor.avarma_status_unterkuhlung', 'sensor.avarma_unterkuhlung', 'Unterkühlung', 'mdi:snowflake', '#3ac8ef'],
          ['sensor.avarma_status_temperaturhub', 'sensor.avarma_temperaturhub', 'Temp.-Hub', 'mdi:arrow-expand-vertical', '#b39dff'],
          ['sensor.avarma_status_luft_verdampfung', 'sensor.avarma_luft_verdampfung', 'Luft → Verd.', 'mdi:weather-windy', '#4fa3ff'],
          ['sensor.avarma_status_kondensation_vorlauf', 'sensor.avarma_kondensation_vorlauf', 'Kond. → VL', 'mdi:waves', '#ff6b6b'],
          ['sensor.avarma_status_spreizung', 'sensor.avarma_spreizung', 'Spreizung', 'mdi:water-outline', '#3a8dff'],
        ];
        const MAP = { ok: ['#3ee06a', 'ok'], warnung: ['#ffd23a', 'warn'], kritisch: ['#ff3b4e', 'crit'] };
        const OFF = ['#c9d3e0', 'off'];
        const mod = S('sensor.avarma_visueller_modus');
        const bw = S('binary_sensor.avarma_kaltekreis_bewertbar') === 'on';
        const cnt = (s) => R.filter((r) => S(r[0]) === s).length;
        let sum, sc;
        if (mod === 'offline') { sum = 'Keine Verbindung'; sc = OFF; }
        else if (!bw) { sum = 'Nicht bewertbar'; sc = OFF; }
        else if (cnt('kritisch') > 0) { sum = cnt('kritisch') + '× deutlich daneben'; sc = MAP.kritisch; }
        else if (cnt('warnung') > 0) { sum = cnt('warnung') + '× beobachten'; sc = MAP.warnung; }
        else { sum = 'Alle im Richtwert'; sc = MAP.ok; }
        const led = (m) => '<span class="led ' + m[1] + '" style="--c:' + m[0] + '"></span>';
        const chips = R.map((r) => {
          const st = S(r[0]), m = MAP[st] || OFF, v = parseFloat(S(r[1]));
          const shown = ['ok', 'warnung', 'kritisch', 'ohne_grenze'].indexOf(st) >= 0 && !isNaN(v);
          return '<div class="ch"><span class="ic" style="--c:' + r[4] + '"><ha-icon icon="' + r[3] + '"></ha-icon></span><span class="tx"><span class="n">' + r[2] + '</span><b' + (shown ? '' : ' class="dim"') + '>' + (shown ? v.toFixed(1).replace('.', ',') + ' K' : '—') + '</b></span>' + led(m) + '</div>';
        }).join('');
        return '<div class="bar"><div class="sm ' + sc[1] + '" style="--c:' + sc[0] + '">' + led(sc) + '<span class="tx"><span class="n">Kältekreis-Ampel</span><b>' + sum + '</b></span><ha-icon class="go" icon="mdi:chevron-right"></ha-icon></div>' + chips + '</div>';
        ]]]
    extra_styles: |-
      .bar{display:flex;flex-wrap:wrap;gap:10px;font-family:Inter,Roboto,"Segoe UI",sans-serif;color:#f0f7ff;text-align:left}
      .sm,.ch{display:flex;align-items:center;gap:10px;border-radius:14px;padding:9px 12px;background:linear-gradient(180deg,rgba(24,40,64,.9),rgba(14,26,44,.9));border:1px solid #284263}
      .sm{flex:1 1 230px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 10%,#0f1b2e);box-shadow:0 0 12px color-mix(in srgb,var(--c) 30%,transparent)}
      .sm.off{box-shadow:none;border-color:#5c6b80}
      .ch{flex:1 1 140px;min-width:0;gap:8px;padding:8px 10px}
      .tx{display:flex;flex-direction:column;min-width:0;flex:1}.n{font-size:12.5px;color:#9fb3cc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx b{font-size:17px;font-weight:800;white-space:nowrap}.tx b.dim{color:#91a5c0;font-weight:600}
      .ic{width:28px;height:28px;border-radius:8px;background:#16263d;border:1px solid #284263;display:flex;align-items:center;justify-content:center;flex:none}
      .ic ha-icon{color:var(--c);--mdc-icon-size:20px}
      .go{color:#9fb3cc;--mdc-icon-size:22px}
      .led{width:16px;height:16px;border-radius:50%;flex:none;background:radial-gradient(circle at 38% 34%,#fff 0 8%,var(--c) 42%,color-mix(in srgb,var(--c) 70%,#000) 100%);box-shadow:0 0 6px var(--c),0 0 14px color-mix(in srgb,var(--c) 50%,transparent)}
      .led.off{box-shadow:0 0 5px rgba(201,211,224,.3)}
      .led.warn,.sm.warn{animation:avP 2.4s ease-in-out infinite}.led.crit,.sm.crit{animation:avB .64s steps(1,end) infinite}
      @keyframes avP{0%,100%{opacity:1}50%{opacity:.55}}@keyframes avB{0%,48%{opacity:1}50%,96%{opacity:.25}100%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.led,.sm{animation:none!important}}
  av_energie:
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    triggers_update:
      - sensor.avarma_strom_tag
      - sensor.avarma_warmemenge_tag
      - sensor.avarma_arbeitszahl_tag
      - sensor.avarma_strom_monat
      - sensor.avarma_warmemenge_monat
      - sensor.avarma_arbeitszahl_monat_schatzung
      - sensor.avarma_strom_jahr
      - sensor.avarma_warmemenge_jahr
      - sensor.avarma_arbeitszahl_jahr_schatzung
    styles:
      card:
        - background: "#111d30"
        - border: "1px solid #2a3b55"
        - border-radius: 18px
        - padding: 16px
        - box-shadow: none
        - container-type: inline-size
      grid:
        - grid-template-areas: "\"e\""
        - grid-template-columns: 1fr
      custom_fields:
        e:
          - width: 100%
    custom_fields:
      e: |-
        [[[
        const S = (id) => (states[id] ? states[id].state : 'unavailable');
        const V = (id) => parseFloat(S(id));
        const A = (id, a) => (states[id] && states[id].attributes ? parseFloat(states[id].attributes[a]) : NaN);
        const F = (v, d, u) => (isNaN(v) ? '–' : v.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d }) + (u ? ' ' + u : ''));
        const az = (th, el) => (el > 0.3 && !isNaN(th) ? th / el : NaN);
        // CO2-Annahmen (anpassbar): Referenzheizung, Emissionsfaktoren in kg CO2/kWh, Bindung je Baum und Jahr in kg
        const REF = 'Heizöl', F_REF = 0.31, ETA = 0.9, F_EL = 0.363, TREE = 10;
        const co2 = (th, el) => (isNaN(th) || isNaN(el) ? NaN : (th / ETA) * F_REF - el * F_EL);
        const P = [
          ['Heute', 'bis ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }), V('sensor.avarma_strom_tag'), V('sensor.avarma_warmemenge_tag'), V('sensor.avarma_arbeitszahl_tag'), true],
          ['Vortag', 'abgeschlossen', A('sensor.avarma_strom_tag', 'last_period'), A('sensor.avarma_warmemenge_tag', 'last_period'), NaN, false],
          ['Monat', new Date().toLocaleDateString('de-DE', { month: 'long' }), V('sensor.avarma_strom_monat'), V('sensor.avarma_warmemenge_monat'), V('sensor.avarma_arbeitszahl_monat_schatzung'), false],
          ['Gesamt', 'seit 03.11.2026', V('sensor.avarma_strom_jahr'), V('sensor.avarma_warmemenge_jahr'), V('sensor.avarma_arbeitszahl_jahr_schatzung'), false],
        ];
        const col = (p) => {
          const [t, sub, el, th, azS, now] = p;
          const a = !isNaN(azS) ? azS : az(th, el);
          const env = !isNaN(th) && !isNaN(el) ? Math.max(0, th - el) : NaN;
          const pe = !isNaN(th) && th > 0 && !isNaN(el) ? Math.min(100, (el / th) * 100) : NaN;
          const d = (x) => (x >= 100 ? 0 : 1);
          return '<div class="pc' + (now ? ' now' : '') + '"><div class="pt">' + t + '<span>' + sub + '</span></div>'
            + '<div class="azl">Arbeitszahl</div><div class="az">' + F(a, 1, '') + '</div>'
            + '<div class="rw"><span><i class="el"></i>Strom</span><b>' + F(el, d(el), 'kWh') + '</b></div>'
            + '<div class="rw"><span><i class="th"></i>Wärme</span><b>' + F(th, d(th), 'kWh') + '</b></div>'
            + '<div class="sp" title="Anteil Strom an der Wärme">' + (isNaN(pe) ? '' : '<span class="se" style="width:' + pe.toFixed(1) + '%"></span><span class="sn" style="width:' + (100 - pe).toFixed(1) + '%"></span>') + '</div>'
            + '<div class="env"><i class="nv"></i>Umweltwärme ' + F(env, d(env), 'kWh') + '</div>'
            + '<div class="co"><ha-icon icon="mdi:molecule-co2"></ha-icon><span>' + F(co2(th, el), co2(th, el) >= 100 ? 0 : 1, 'kg') + ' CO₂ gespart</span></div></div>';
        };
        const tot = co2(V('sensor.avarma_warmemenge_jahr'), V('sensor.avarma_strom_jahr'));
        const trees = isNaN(tot) ? NaN : tot / TREE;
        const nIc = isNaN(trees) ? 0 : Math.min(20, Math.floor(trees));
        const part = isNaN(trees) || trees >= 20 ? 0 : trees - Math.floor(trees);
        const icons = Array.from({ length: nIc }, () => '<ha-icon icon="mdi:pine-tree"></ha-icon>').join('') + (part > 0.05 ? '<span class="tp"><ha-icon class="bg" icon="mdi:pine-tree"></ha-icon><span class="fg" style="width:' + Math.round(part * 100) + '%"><ha-icon icon="mdi:pine-tree"></ha-icon></span></span>' : '') + (trees > 20 ? '<span class="more">+' + Math.round(trees - 20) + '</span>' : '');
        const eco = '<input type="checkbox" id="enco" class="tg"><div class="eco"><div class="ek"><div class="el1">CO₂-Einsparung seit 03.11.</div><div class="ev1">' + F(tot, 0, 'kg') + '</div><div class="el2">gegenüber ' + REF + 'heizung <label for="enco" class="inf" title="Annahmen">i</label></div></div>'
          + '<div class="tr"><div class="ti">' + (icons || '<span class="el2">noch keine</span>') + '</div><div class="t2">entspricht <b>' + F(trees, 1, '') + ' Bäumen</b>, die ein Jahr lang CO₂ binden</div></div></div>'
          + '<div class="ann">Annahmen: ' + REF + ' ' + String(F_REF).replace('.', ',') + ' kg CO₂/kWh Brennstoff, Kesselwirkungsgrad ' + Math.round(ETA * 100) + ' %; Strom (Netzmix) ' + String(F_EL).replace('.', ',') + ' kg CO₂/kWh; ein Baum bindet etwa ' + TREE + ' kg CO₂ pro Jahr. Eigener PV-Strom ist nicht berücksichtigt (Einsparung dann höher). Grobe Schätzung, kein Nachweis.</div>';
        return '<div class="en"><div class="hd"><ha-icon icon="mdi:lightning-bolt"></ha-icon><span class="h">Energiebilanz</span><span class="hn">Strom vom RCBO inkl. Standby · Wärme geschätzt (Durchfluss × Spreizung)</span></div>'
          + '<div class="gr">' + P.map(col).join('') + '</div>' + eco + '</div>';
        ]]]
    extra_styles: |-
      .en{font-family:Inter,Roboto,"Segoe UI",sans-serif;color:#f0f7ff;text-align:left}
      .hd{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;margin:0 2px 14px}
      .hd ha-icon{--mdc-icon-size:30px;color:#ffd54f}.h{font-size:24px;font-weight:800}.hn{margin-left:auto;font-size:12.5px;color:#91a5c0}
      .gr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
      .pc{background:#16263d;border:1px solid #284263;border-radius:16px;padding:12px 14px 14px;min-width:0}
      .pc.now{background:linear-gradient(180deg,#183251,#122440);border-color:#3ac8ef}
      .pt{font-size:16px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:8px}.pt span{font-size:12px;font-weight:500;color:#91a5c0;white-space:nowrap}
      .azl{font-size:12px;color:#91a5c0;margin-top:10px}
      .az{font-size:40px;font-weight:800;line-height:1.05;color:#48d18c;letter-spacing:-.5px}
      .rw{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px;font-size:14px}.rw span{color:#c9d7ea;display:flex;align-items:center;gap:7px}.rw b{font-size:16px;white-space:nowrap}
      i{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}.el{background:#ffd54f}.th{background:#ff8a2a}.nv{background:#48d18c}
      .sp{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#22324a;margin-top:12px}.se{background:#ffd54f}.sn{background:#48d18c}
      .env{font-size:12.5px;color:#91a5c0;margin-top:6px;display:flex;align-items:center;gap:7px}
      .co{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid #243650;font-size:13px;font-weight:700;color:#7fe0a6}.co ha-icon{--mdc-icon-size:20px;color:#48d18c;flex:none}
      .tg{display:none}
      .eco{display:flex;align-items:center;gap:18px;margin-top:12px;padding:14px 16px;border-radius:16px;background:linear-gradient(90deg,#10291d,#0f2033);border:1px solid #2f6b4a}
      .ek{flex:none}.el1{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#7fe0a6}.ev1{font-size:34px;font-weight:800;color:#48d18c;line-height:1.1}
      .el2{font-size:13px;color:#c9d7ea;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.el2 b{color:#f0f7ff}
      .t2{font-size:13px;color:#c9d7ea}.t2 b{color:#f0f7ff}
      .tr{flex:1;min-width:0}.ti{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:6px}.ti ha-icon{--mdc-icon-size:30px;color:#48d18c}
      .tp{display:inline-block;width:30px;height:30px;position:relative}.ti .tp .bg{color:#2f4a3c}.tp .fg{position:absolute;left:0;top:0;height:30px;overflow:hidden}
      .more{align-self:center;font-weight:800;color:#48d18c;margin-left:6px}
      .inf{width:18px;height:18px;border-radius:50%;border:1.5px solid #9fb3cc;color:#9fb3cc;display:inline-flex;align-items:center;justify-content:center;font:700 11px Georgia,serif;cursor:pointer}
