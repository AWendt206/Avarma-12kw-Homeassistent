    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    triggers_update:
      - sensor.avarma_visueller_modus
      - select.hausinstallation_avarma_betrieb
      - sensor.hausinstallation_avarma_aussentemperatur
      - sensor.hausinstallation_avarma_verdichterfrequenz_ist
      - sensor.hausinstallation_avarma_lufter_1_drehzahl
      - sensor.avarma_strom_leistung
      - sensor.avarma_cop_aktuell
      - sensor.avarma_strom_tag
      - sensor.avarma_warmemenge_tag
      - sensor.avarma_arbeitszahl_tag
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - padding: 0px
      grid:
        - grid-template-areas: "\"bar\""
        - grid-template-columns: 1fr
      custom_fields:
        bar:
          - width: 100%
    custom_fields:
      bar: |-
        [[[
        const S = (id) => (states[id] ? states[id].state : 'unavailable');
        const V = (id) => parseFloat(S(id));
        const A = (id, a) => (states[id] && states[id].attributes ? parseFloat(states[id].attributes[a]) : NaN);
        const F = (v, d, u) => (isNaN(v) ? '–' : v.toFixed(d).replace('.', ',') + (u ? ' ' + u : ''));
        const P = 'sensor.hausinstallation_avarma_';
        const mode = S('sensor.avarma_visueller_modus'), bet = S('select.hausinstallation_avarma_betrieb');
        const MT = { heizen: ['Heizen', 'mdi:fire', '#ff8a2a'], abtauen: ['Abtauen', 'mdi:snowflake-melt', '#ffbf55'], standby: ['Standby', 'mdi:pause-circle-outline', '#91a5c0'], aus: ['Aus', 'mdi:power-off', '#91a5c0'], stoerung: ['Störung', 'mdi:alert', '#ff727f'], offline: ['Offline', 'mdi:lan-disconnect', '#ff727f'] };
        const mt = MT[mode] || ['Unbekannt', 'mdi:help-circle-outline', '#91a5c0'];
        const pw = V('sensor.avarma_strom_leistung');
        const live = [
          ['mdi:thermometer', '#4c9eff', 'Außen', F(V(P + 'aussentemperatur'), 1, '°C')],
          ['mdi:engine', '#ffbf55', 'Verdichter', F(V(P + 'verdichterfrequenz_ist'), 0, 'Hz')],
          ['mdi:fan', '#3ac8ef', 'Lüfter', F(V(P + 'lufter_1_drehzahl'), 0, 'U/min')],
          ['mdi:flash', '#ffd54f', 'Leistung', isNaN(pw) ? '–' : (pw >= 1000 ? F(pw / 1000, 2, 'kW') : F(pw, 0, 'W'))],
          ['mdi:leaf', '#48d18c', 'COP aktuell', F(V('sensor.avarma_cop_aktuell'), 1, '')],
        ];
        const elH = V('sensor.avarma_strom_tag'), elV = A('sensor.avarma_strom_tag', 'last_period');
        const thH = V('sensor.avarma_warmemenge_tag'), thV = A('sensor.avarma_warmemenge_tag', 'last_period');
        const azH = V('sensor.avarma_arbeitszahl_tag'), azV = elV > 0.5 && !isNaN(thV) ? thV / elV : NaN;
        const sinceMid = (Date.now() - new Date().setHours(0, 0, 0, 0)) / 3600e3;
        const pct = !isNaN(elH) && elV > 0 ? Math.round((elH / elV) * 100) : NaN;
        let h = '<div class="k">';
        h += '<div class="tt"><ha-icon icon="mdi:heat-pump-outline"></ha-icon><span class="h">Avarma 12 kW – Wärmepumpe</span>'
          + '<span class="st" style="--c:' + (bet === 'EIN' ? mt[2] : '#91a5c0') + '"><ha-icon icon="' + (bet === 'EIN' ? mt[1] : 'mdi:power-off') + '"></ha-icon>' + (bet === 'AUS' ? 'Aus' : bet === 'EIN' ? 'Ein · ' + mt[0] : '–') + '</span></div>';
        h += '<div class="gr"><div class="bx"><div class="lb">Jetzt</div><div class="lv">'
          + live.map((c) => '<div class="ch"><ha-icon icon="' + c[0] + '" style="color:' + c[1] + '"></ha-icon><div><div class="cl">' + c[2] + '</div><div class="cv">' + c[3] + '</div></div></div>').join('')
          + '</div></div>';
        h += '<div class="bx en"><div class="lb">Stromverbrauch Wärmepumpe</div><div class="ev">'
          + '<div><div class="cl">Heute <small>bis ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + '</small></div><div class="big">' + F(elH, 1, 'kWh') + '</div></div>'
          + '<div><div class="cl">Vortag</div><div class="big dim">' + F(elV, 1, 'kWh') + '</div></div></div>'
          + '<div class="pb"><span style="width:' + (isNaN(pct) ? 0 : Math.min(100, pct)) + '%"></span><i style="left:' + Math.min(100, (sinceMid / 24) * 100).toFixed(1) + '%" title="Tageszeit"></i></div>'
          + '<div class="sub">' + (isNaN(pct) ? '' : pct + ' % des Vortags erreicht · ') + 'Wärme ' + F(thH, 0, 'kWh') + ' / Vortag ' + F(thV, 0, 'kWh') + ' · AZ ' + F(azH, 1, '') + ' / ' + F(azV, 1, '') + '</div></div>';
        return h + '</div></div>';
        ]]]
    extra_styles: |-
      .k{font-family:Inter,Roboto,"Segoe UI",sans-serif;color:#f0f7ff;text-align:left}
      .tt{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:2px 4px 12px}
      .tt>ha-icon{--mdc-icon-size:36px;color:#3ac8ef}.h{font-size:28px;font-weight:800;letter-spacing:-.3px}
      .st{margin-left:auto;display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:2px solid var(--c);border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);font-size:15px;font-weight:700}
      .st ha-icon{--mdc-icon-size:20px}
      .gr{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}
      .bx{background:#111d30;border:1px solid #2a3b55;border-radius:16px;padding:10px 12px 12px;display:flex;flex-direction:column}
      .lb{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#91a5c0;margin:0 2px 8px}
      .lv{flex:1;align-content:center;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
      .ch{display:flex;align-items:center;gap:10px;background:#16263d;border:1px solid #243650;border-radius:12px;padding:8px 10px}
      .ch ha-icon{--mdc-icon-size:24px;flex:none}
      .cl{font-size:12.5px;color:#c9d7ea}.cl small{color:#91a5c0}.cv{font-size:17px;font-weight:800;white-space:nowrap}
      .ev{display:grid;grid-template-columns:1fr 1fr;gap:10px}
      .big{font-size:30px;font-weight:800;line-height:1.15;white-space:nowrap}.big.dim{color:#b9c8dc}
      .pb{position:relative;height:8px;border-radius:4px;background:#22324a;margin:10px 0 8px;overflow:visible}
      .pb span{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#ffbf55,#ffd54f)}
      .pb i{position:absolute;top:-3px;width:2px;height:14px;background:#f0f7ff;opacity:.7}
      .sub{font-size:12.5px;color:#91a5c0}
      @media (max-width:900px){.gr{grid-template-columns:1fr}}
      @media (max-width:600px){.h{font-size:20px}.tt>ha-icon{--mdc-icon-size:28px}.st{margin-left:0}.lv{grid-template-columns:1fr 1fr}.lv .ch:last-child:nth-child(odd){grid-column:1/-1}.big{font-size:26px}}
