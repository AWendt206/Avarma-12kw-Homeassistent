      - sensor.avarma_status_luft_verdampfung
      - sensor.avarma_status_kondensation_vorlauf
      - sensor.avarma_status_spreizung
      - sensor.avarma_uberhitzung
      - sensor.avarma_unterkuhlung
      - sensor.avarma_temperaturhub
      - sensor.avarma_luft_verdampfung
      - sensor.avarma_kondensation_vorlauf
      - sensor.avarma_spreizung
      - sensor.avarma_visueller_modus
      - binary_sensor.avarma_kaltekreis_bewertbar
      - binary_sensor.avarma_verdichter_lauft
    tap_action:
      action: none
    styles:
      card:
        - background: linear-gradient(180deg,#14263f 0%,#0c1729 100%)
        - border: "1px solid #2a4a6e"
        - border-radius: 24px
        - padding: 18px 18px 16px
        - container-type: inline-size
        - box-shadow: 0 0 0 1px rgba(80,140,210,.10), 0 18px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05)
      grid:
        - grid-template-areas: "\"p\""
        - grid-template-columns: 1fr
      custom_fields:
        p:
          - width: 100%
    custom_fields:
      p: |-
        [[[
        const S = (e) => (states[e] ? states[e].state : 'unbekannt');
        const R = [
          ['sensor.avarma_status_uberhitzung', 'sensor.avarma_uberhitzung', 'Überhitzung', 'Ts − Te', '−1 … 3 K (Soll 0,5)', 'mdi:thermometer', '#b39dff'],
          ['sensor.avarma_status_unterkuhlung', 'sensor.avarma_unterkuhlung', 'Unterkühlung', 'Tk − Ty', '1 … 8 K', 'mdi:snowflake', '#3ac8ef'],
          ['sensor.avarma_status_temperaturhub', 'sensor.avarma_temperaturhub', 'Temperaturhub', 'Tk − Te', 'bis 40 K', 'mdi:arrow-expand-vertical', '#b39dff'],
          ['sensor.avarma_status_luft_verdampfung', 'sensor.avarma_luft_verdampfung', 'Luft → Verdampfung', 'Außen − Te', '3 … 10 K', 'mdi:weather-windy', '#4fa3ff'],
          ['sensor.avarma_status_kondensation_vorlauf', 'sensor.avarma_kondensation_vorlauf', 'Kondensation → Vorlauf', 'Tk − VL', '−1 … 6 K', 'mdi:waves', '#ff6b6b'],
          ['sensor.avarma_status_spreizung', 'sensor.avarma_spreizung', 'Spreizung Heizwasser', 'VL − RL', 'bis 8 K (Schutz 12 K)', 'mdi:water-outline', '#3a8dff'],
        ];
        const MAP = {
          ok: ['#3ee06a', 'Im Richtwert', 'mdi:check', 'ok'],
          warnung: ['#ffd23a', 'Beobachten', 'mdi:alert', 'warn'],
          kritisch: ['#ff3b4e', 'Deutlich daneben', 'mdi:close-thick', 'crit'],
          ohne_grenze: ['#c9d3e0', 'Ohne Grenzwert', 'mdi:minus', 'off'],
          inaktiv: ['#c9d3e0', 'Nicht bewertbar', 'mdi:minus', 'off'],
          unbekannt: ['#c9d3e0', 'Keine Daten', 'mdi:minus', 'off'],
        };
        const mod = S('sensor.avarma_visueller_modus');
        const bw = S('binary_sensor.avarma_kaltekreis_bewertbar') === 'on';
        const cnt = (s) => R.filter((r) => S(r[0]) === s).length;
        let sum, sc;
        if (mod === 'offline') { sum = 'Keine Verbindung zur Anlage'; sc = MAP.unbekannt; }
        else if (!bw) { sum = 'Nicht bewertbar · ' + (mod === 'abtauen' ? 'Abtauung läuft' : (S('binary_sensor.avarma_verdichter_lauft') === 'on' ? 'Einschwingphase (10 min)' : 'Verdichter steht')); sc = MAP.inaktiv; }
        else if (cnt('kritisch') > 0) { sum = 'Kältekreis: ' + cnt('kritisch') + ' Kennwert deutlich daneben'; sc = MAP.kritisch; }
        else if (cnt('warnung') > 0) { sum = 'Kältekreis: ' + cnt('warnung') + ' Kennwert beobachten'; sc = MAP.warnung; }
        else { sum = 'Kältekreis: Alle Kennwerte im Richtwert'; sc = MAP.ok; }
        const led = (m) => '<span class="led ' + m[3] + '" style="--c:' + m[0] + '"></span>';
        const pill = (m) => '<span class="pill ' + m[3] + '" style="--c:' + m[0] + '"><ha-icon icon="' + m[2] + '"></ha-icon>' + m[1] + '</span>';
        const rows = R.map((r) => {
          const st = S(r[0]), m = MAP[st] || MAP.unbekannt, v = parseFloat(S(r[1]));
          const shown = ['ok', 'warnung', 'kritisch', 'ohne_grenze'].indexOf(st) >= 0 && !isNaN(v);
          const val = shown ? v.toFixed(1).replace('.', ',') + ' K' : '—';
          const mi = "this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'" + r[1] + "'}}))";
          return '<div class="r" onclick="' + mi + '"><span class="ic" style="--c:' + r[6] + '"><ha-icon icon="' + r[5] + '"></ha-icon></span>'
            + '<span class="nm">' + r[2] + '<small>' + r[3] + ' · ' + r[4] + '</small></span><span class="fo">' + r[3] + '</span>'
            + '<span class="va' + (shown ? '' : ' dim') + '">' + val + '</span><span class="rw">' + r[4] + '</span>'
            + '<span class="st">' + led(m) + pill(m) + '</span></div>';
        }).join('');
        const lg = [[MAP.ok, 'Grün', 'Im Richtwert (alles OK)'], [MAP.warnung, 'Gelb', 'Auffällig, beobachten (leuchtend, sanft pulsierend)'], [MAP.kritisch, 'Rot', 'Deutlich daneben (schnell blinkend)'], [MAP.unbekannt, 'Grau', 'Keine Bewertung möglich (z. B. Verdichter steht)']]
          .map((x) => '<div class="li">' + led(x[0]) + '<div><b>' + x[1] + '</b><span>' + x[2] + '</span></div></div>').join('');
        return '<div class="ap"><input type="checkbox" id="avinf" class="tg">'
          + '<div class="top"><div class="ti"><ha-icon icon="mdi:snowflake"></ha-icon><span class="h1">Kältekreis-Ampel</span><label for="avinf" class="inf" title="So wird bewertet">i</label></div>'
          + '<div class="sum ' + sc[3] + '" style="--c:' + sc[0] + '"><ha-icon icon="' + (sc[3] === 'ok' ? 'mdi:check-circle' : sc[3] === 'off' ? 'mdi:help-circle' : 'mdi:alert-circle') + '"></ha-icon>' + sum + '</div></div>'
          + '<div class="exp"><b>So wird bewertet:</b> Bewertbar nur bei verbundenem ESP32, Verdichter seit mindestens 10 min in Betrieb, 10 min nach der letzten Abtauung und vollständigen Messwerten – sonst grau. Überhitzung um Soll 0,5 K (P92–P96), Spreizung mit Pumpen-Soll 5 K (P58) und Schutzgrenze 12 K (P102). Unterkühlung, Temperaturhub, Luft → Verdampfung und Kondensation → Vorlauf sind Erfahrungswerte, keine Herstellerangaben. Grün ist keine physikalische Freigabe. Zeile antippen öffnet den Verlauf.</div>'
          + '<div class="tb"><div class="r h"><span></span><span class="nm">Kennwert</span><span class="fo">Formel</span><span class="va">Aktuell</span><span class="rw">Richtwert</span><span class="st">Status</span></div>' + rows + '</div>'
          + '<div class="lg">' + lg + '</div></div>';
        ]]]
    extra_styles: |-
      .ap{color:#f0f7ff;font-family:Inter,Roboto,"Segoe UI",sans-serif;text-align:left}
      .tg{display:none}
      .top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:4px 4px 14px}
      .ti{display:flex;align-items:center;gap:14px}.ti>ha-icon{--mdc-icon-size:34px;color:#fff;filter:drop-shadow(0 0 6px rgba(120,190,255,.45))}
