    styles:
      card:
        - background: "#111d30"
        - border: "1px solid #2a3b55"
        - border-radius: 18px
        - padding: 16px
        - box-shadow: none
        - container-type: inline-size
      grid:
        - grid-template-areas: "\"p\""
        - grid-template-columns: 1fr
      custom_fields:
        p:
          - width: 100%
    custom_fields:
      p: |-
        [[[
        const st = (id) => states[id];
        const S = (id) => (st(id) ? st(id).state : 'unavailable');
        const V = (id) => parseFloat(S(id));
        const F = (v, d, u) => (isNaN(v) ? '–' : v.toFixed(d).replace('.', ',') + (u ? ' ' + u : ''));
        const N = 'number.hausinstallation_avarma_', R = 'sensor.hausinstallation_avarma_';
        const W = [
          ['P02', 'Vorlauf-Sollwert', 'mdi:thermometer-check', N + 'vorlauf_sollwert_heizen', '°C', 0, 45],
          ['P06', 'Hysterese Heizen', 'mdi:delta', N + 'hysterese_heizen', 'K', 1, 5],
          ['P114', 'Frequenzabsenkung', 'mdi:arrow-down-bold', N + 'frequenzabsenkung', '%', 0, 2],
          ['P46', 'Mindestfrequenz Verdichter', 'mdi:speedometer-slow', N + 'mindestfrequenz_verdichter', 'Hz', 0, 35],
          ['P47', 'Abtaufrequenz', 'mdi:snowflake-melt', N + 'abtaufrequenz', 'Hz', 0, 65],
          ['P60', 'Lüfter Maximaldrehzahl', 'mdi:fan', N + 'maximaldrehzahl_lufter', 'U/min', 0, 900],
          ['P15', 'Nachtmodus Start', 'mdi:clock-start', N + 'nachtmodus_start', 'Uhr', 0, null],
          ['P16', 'Nachtmodus Ende', 'mdi:clock-end', N + 'nachtmodus_ende', 'Uhr', 0, null],
        ];
        const SEL = [
          ['P00', 'Betrieb', 'select.hausinstallation_avarma_betrieb', null],
          ['P19', 'Regelart', 'select.hausinstallation_avarma_regelart_heizen', 'Fester Sollwert'],
          ['P17', 'Nachtmodus', 'select.hausinstallation_avarma_nachtmodus', null],
        ];
        const RO = [
          ['P105', 'Startfrequenz', R + 'p105', 1, 'Hz', 0, 35],
          ['P45', 'Maximalfrequenz', R + 'p45', 1, 'Hz', 0, 85],
          ['P86', 'Abtau-Differenz', R + 'p86', 10, 'K', 1, 5],
          ['P20', 'Pumpen-Betriebsart', R + 'p20', 1, '', 0, 0],
          ['P39', 'Verdichtermodell', R + 'p39', 1, '', 0, 73],
        ];
        const chip = (eq) => (eq == null ? '<span class="cp na">Werk unbekannt</span>' : eq ? '<span class="cp eq">= Werk</span>' : '<span class="cp ne">≠ Werk</span>');
        const rows = W.map((r) => {
          const e = st(r[3]), v = V(r[3]);
          const mn = e ? parseFloat(e.attributes.min) : NaN, mx = e ? parseFloat(e.attributes.max) : NaN;
          const pos = (x) => (isNaN(x) || isNaN(mn) || mx <= mn ? null : Math.max(0, Math.min(100, ((x - mn) / (mx - mn)) * 100)));
          const pv = pos(v), pw = r[6] == null ? null : pos(r[6]);
          const eq = r[6] == null || isNaN(v) ? null : Math.abs(v - r[6]) < 0.01;
          const mi = "this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'" + r[3] + "'}}))";
          return '<div class="r" onclick="' + mi + '"><span class="ic"><ha-icon icon="' + r[2] + '"></ha-icon></span>'
            + '<span class="nm">' + r[1] + '<small>' + r[0] + (r[6] == null ? '' : ' · Werk ' + F(r[6], r[5], r[4])) + '</small></span>'
            + '<span class="br"><span class="tr">' + (pv == null ? '' : '<span class="fill" style="width:' + pv + '%"></span><span class="dot" style="left:' + pv + '%"></span>') + (pw == null ? '' : '<span class="wk" style="left:' + pw + '%" title="Werk"></span>') + '</span>'
            + '<span class="mm"><span>' + F(mn, r[5], '') + '</span><span>' + F(mx, r[5], r[4]) + '</span></span></span>'
            + '<span class="va">' + F(v, r[5], r[4]) + '</span>' + chip(eq) + '</div>';
        }).join('');
        const sels = SEL.map((s) => { const v = S(s[2]); const eq = s[3] == null ? null : v === s[3];
          return '<div class="sc"><span class="sl">' + s[1] + '<small>' + s[0] + '</small></span><b class="' + (v === 'EIN' ? 'on' : '') + '">' + (v === 'Witterungsgeführt (OTC)' ? 'OTC' : v) + '</b>' + (s[3] == null ? '' : chip(eq)) + '</div>'; }).join('');
        const ro = RO.map((r) => { const v = V(r[2]) / r[3]; const eq = isNaN(v) ? null : Math.abs(v - r[6]) < 0.01;
          return '<div class="ro"><span class="sl">' + r[1] + '<small>' + r[0] + ' · Werk ' + F(r[6], r[5], r[4]) + '</small></span><b>' + F(v, r[5], r[4]) + '</b>' + chip(eq) + '</div>'; }).join('')
          + '<div class="ro"><span class="sl">Stromgrenzen<small>P42–44 · Werk 6/8/9 A</small></span><b>' + [42, 43, 44].map((n) => F(V(R + 'p' + n) / 10, 0, '')).join(' / ') + ' A</b><span class="cp na">Handbuch unsicher</span></div>';
        return '<div class="pv"><div class="hd"><ha-icon icon="mdi:tune-vertical"></ha-icon><span class="h">Einstellungen auf einen Blick</span><span class="hn">Rücklesewerte der Anlage · Werk = 12-kW-Spalte Hofman HE-AI-290 · Antippen öffnet Verlauf</span></div>'
          + '<div class="sels">' + sels + '</div><div class="rows">' + rows + '</div>'
          + '<div class="rh"><ha-icon icon="mdi:shield-lock"></ha-icon>Nur lesbar (nicht über Home Assistant änderbar)</div><div class="ros">' + ro + '</div></div>';
        ]]]
    extra_styles: |-
      .pv{font-family:Inter,Roboto,"Segoe UI",sans-serif;color:#f0f7ff;text-align:left}
      .hd{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:0 2px 12px}.hd ha-icon{--mdc-icon-size:28px;color:#3ac8ef}.h{font-size:22px;font-weight:800}.hn{margin-left:auto;font-size:12.5px;color:#91a5c0}
      .sels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:10px}
      .sc,.ro{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:#16263d;border:1px solid #284263;border-radius:12px;padding:8px 12px}
      .sl{flex:1 1 130px;min-width:0;font-size:14px;color:#c9d7ea}.sl small{display:block;font-size:11.5px;color:#7f93ae}
      .sc b,.ro b{font-size:16px;white-space:nowrap}.sc b.on{color:#48d18c}
      .rows{border:1px solid #233a58;border-radius:14px;background:rgba(8,16,30,.45);padding:2px 10px}
      .r{display:grid;grid-template-columns:34px minmax(150px,1.2fr) minmax(140px,1.6fr) minmax(104px,auto) 104px;align-items:center;column-gap:14px;padding:9px 0;border-bottom:1px solid #1e3350;cursor:pointer}
      .r:last-child{border-bottom:none}.r:hover{background:rgba(58,200,239,.05)}
      .ic{width:34px;height:34px;border-radius:9px;background:#16263d;border:1px solid #284263;display:flex;align-items:center;justify-content:center}.ic ha-icon{--mdc-icon-size:20px;color:#3ac8ef}
      .nm{font-size:15px;font-weight:700;min-width:0}.nm small{display:block;font-size:11.5px;font-weight:500;color:#7f93ae}
      .br{display:block;min-width:0}.tr{position:relative;display:block;height:8px;border-radius:4px;background:#22324a;margin-top:4px}
      .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#1f6f8f,#3ac8ef)}
      .dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#3ac8ef;border:2px solid #0c1729;box-shadow:0 0 8px #3ac8ef}
      .wk{position:absolute;top:-5px;width:2px;height:18px;margin-left:-1px;background:#f0f7ff;opacity:.85}
      .mm{display:flex;justify-content:space-between;font-size:11px;color:#7f93ae;margin-top:4px}
      .va{font-size:17px;font-weight:800;text-align:right;white-space:nowrap}
      .cp{justify-self:start;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
      .cp.eq{color:#91a5c0;border-color:#3a4d68}.cp.ne{color:#ffbf55;border-color:#7a6230;background:rgba(255,191,85,.08)}.cp.na{color:#7f93ae;border-color:#2f3f57}
      .rh{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;font-size:14px;font-weight:800;color:#c9d7ea}.rh ha-icon{--mdc-icon-size:18px;color:#91a5c0}
      .ros{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
      @container (max-width:700px){.r{grid-template-columns:34px minmax(0,1fr) auto;grid-template-areas:"ic nm va" "br br cp";row-gap:6px}.ic{grid-area:ic}.nm{grid-area:nm}.va{grid-area:va}.br{grid-area:br}.cp{grid-area:cp;align-self:end}.hn{margin-left:0;width:100%}}
  av_health:
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    triggers_update:
      - binary_sensor.hausinstallation_avarma_status
      - sensor.avarma_aktive_fehler
      - sensor.avarma_fehlerspeicher
      - binary_sensor.avarma_alarm
      - sensor.hausinstallation_avarma_r290_konzentration
      - sensor.hausinstallation_avarma_r290_alarm_code
      - binary_sensor.avarma_frostschutz_aktiv
      - sensor.hausinstallation_avarma_wlan_signal
      - automation.avarma_frostsperre
      - binary_sensor.avarma_frostsperre_gewunscht
      - switch.avarma_rcbo
      - sensor.avarma_rcbo_event
      - sensor.avarma_rcbo_current
      - sensor.avarma_strom_leistung
      - sensor.avarma_rcbo_leakage_current
      - sensor.avarma_rcbo_temperature
      - sensor.avarma_rcbo_voltage
      - number.avarma_rcbo_over_current_threshold
      - number.avarma_rcbo_over_power_threshold
      - number.avarma_rcbo_leakage_threshold
      - number.avarma_rcbo_temperature_threshold
      - number.avarma_rcbo_over_voltage_threshold
      - number.avarma_rcbo_under_voltage_threshold
      - sensor.hausinstallation_avarma_fehlergruppe_0_code
      - sensor.hausinstallation_avarma_fehlergruppe_1_code
      - sensor.hausinstallation_avarma_fehlergruppe_2_code
      - sensor.hausinstallation_avarma_fehlergruppe_3_code
      - sensor.hausinstallation_avarma_treiberfehler_0_code
      - sensor.hausinstallation_avarma_treiberfehler_1_code
      - sensor.hausinstallation_avarma_treiberfehler_2_code
      - sensor.hausinstallation_avarma_frequenzbegrenzung_code
      - sensor.hausinstallation_avarma_olruckfuhrung_aktiv
      - sensor.hausinstallation_avarma_verdichter_betriebsstunden
      - sensor.hausinstallation_avarma_verdichterstarts_gesamt
      - sensor.hausinstallation_avarma_abtauvorgange_gesamt
      - sensor.hausinstallation_avarma_netzspannung
